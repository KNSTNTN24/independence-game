// ===== AUTH =====
async function checkAuth(){
  const{data:{session}}=await supabase.auth.getSession();
  if(!session){S.loading=false;render();return;}
  S.user=session.user;
  const{data:profile}=await supabase.from('profiles').select('*').eq('id',session.user.id).single();
  if(!profile?.is_admin){S.loading=false;S.error='Access denied. Admin rights required.';render();return;}
  S.profile=profile;S.loading=false;
  await loadData(S.tab);
  render();
}

async function signIn(email,password){
  const{error}=await supabase.auth.signInWithPassword({email,password});
  if(error)throw error;
  await checkAuth();
}

// ===== DATA =====
async function loadData(tab){
  const cfg=TABS[tab];if(!cfg)return;
  const{data,error}=await supabase.from(cfg.table).select('*').order('sort_order',{ascending:true,nullsFirst:false});
  if(error){console.error('Load error:',error);return;}
  S.data[tab]=data||[];
  render();
}

function getFilteredItems(tab){
  const items=S.data[tab]||[];
  const cfg=TABS[tab];
  if(S.modeFilter==='all')return items;
  if(cfg.modeField)return items.filter(i=>i[cfg.modeField]===S.modeFilter);
  if(cfg.hasGameModes)return items.filter(i=>(i.game_modes||[]).includes(S.modeFilter));
  return items;
}

async function saveItem(tab,item){
  const cfg=TABS[tab];
  const isNew=!item._original;
  const toSave={...item};
  delete toSave._original;
  
  let result;
  if(isNew){
    result=await supabase.from(cfg.table).insert(toSave);
  }else{
    let query=supabase.from(cfg.table).update(toSave);
    cfg.pkFields.forEach(pk=>{query=query.eq(pk,item._original[pk]);});
    result=await query;
  }
  if(result.error){toast('Error: '+result.error.message,'error');return false;}
  toast('Saved!','success');
  await loadData(tab);
  S.editing=null;
  render();
  return true;
}

async function deleteItem(tab,item){
  if(!confirm('Delete this record?'))return;
  const cfg=TABS[tab];
  let query=supabase.from(cfg.table).delete();
  cfg.pkFields.forEach(pk=>{query=query.eq(pk,item[pk]);});
  const{error}=await query;
  if(error){toast('Error: '+error.message,'error');return;}
  toast('Deleted','success');
  await loadData(tab);
  render();
}

function toast(msg,type='info'){
  S.toast={msg,type};render();
  setTimeout(()=>{S.toast=null;render();},3000);
}

// ===== RENDER =====
function render(){
  const app=document.getElementById('app');
  if(S.loading){app.innerHTML=`<div class="flex items-center justify-center min-h-screen"><div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div></div>`;return;}
  if(S.error){app.innerHTML=`<div class="flex items-center justify-center min-h-screen"><div class="text-center"><p class="text-red-400 text-xl mb-4">⛔ ${S.error}</p><button onclick="location.reload()" class="px-4 py-2 bg-slate-700 rounded hover:bg-slate-600">Reload</button></div></div>`;return;}
  if(!S.user){app.innerHTML=renderLogin();attachLoginListener();return;}
  
  app.innerHTML=`
    <div class="flex h-screen">
      ${renderSidebar()}
      <div class="flex-1 overflow-auto">
        ${renderHeader()}
        ${renderContent()}
      </div>
    </div>
    ${S.editing?renderEditModal():''}
    ${S.toast?`<div class="fixed bottom-4 right-4 z-50 px-4 py-3 rounded-lg ${S.toast.type==='error'?'bg-red-600':'bg-green-600'} shadow-lg">${esc(S.toast.msg)}</div>`:''}
  `;
  attachLoginListener();
}

function renderHeader(){
  const cfg=TABS[S.tab];

    <div>
      <h2 class="text-xl font-bold">${cfg.icon} ${cfg.name}</h2>
      <p class="text-gray-500 text-xs">${cfg.table}</p>
    </div>
    <div class="flex items-center gap-2">
      ${showModeFilter?`
        <select onchange="setModeFilter(this.value)" class="px-3 py-1.5 bg-slate-700 border border-slate-600 rounded-lg text-sm focus:outline-none">
          <option value="all" ${S.modeFilter==='all'?'selected':''}>All modes</option>
          ${GAME_MODES.map(m=>`<option value="${m}" ${S.modeFilter===m?'selected':''}>${m}</option>`).join('')}
        </select>
      `:''}

}

function renderContent(){
  const cfg=TABS[S.tab];
  const items=getFilteredItems(S.tab);
  if(!items.length)return`<div class="p-8 text-center text-gray-400"><p class="text-4xl mb-2">📭</p><p>No records</p></div>`;
  
  return`<div class="p-4 space-y-1.5">
    ${items.map(item=>renderItem(cfg,item)).join('')}
  </div>`;
}

function renderItem(cfg,item){
  const pk=item[cfg.pkFields[0]];
  const titleField=cfg.fields.find(f=>f.type==='jsonb')?.key;
  const title=titleField&&item[titleField]?(item[titleField].en||item[titleField].ru||pk):pk;
  const mode=item.game_mode;
  const modes=item.game_modes;
  const pkId=cfg.pkFields.map(k=>item[k]).join('|||');
  
  return`<div class="bg-slate-800 rounded-lg p-3 border border-slate-700 hover:border-slate-500 transition">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        ${item.icon?`<span class="text-xl shrink-0">${item.icon}</span>`:''}
        <div class="min-w-0">
          <p class="font-semibold text-amber-200 truncate">${esc(String(title).substring(0,60))}</p>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="text-xs text-gray-500">${pk}</span>
            ${mode?`<span class="mode-badge mode-${mode}">${mode}</span>`:''}
            ${modes?modes.map(m=>`<span class="mode-badge mode-${m}">${m}</span>`).join(''):''}
            ${item.is_chain_trigger?'<span class="text-xs bg-purple-900/50 text-purple-300 px-1.5 rounded">⛓️ trigger</span>':''}
            ${item.is_chain_reaction?'<span class="text-xs bg-blue-900/50 text-blue-300 px-1.5 rounded">⛓️ reaction</span>':''}
            ${item.is_premium?'<span class="text-xs bg-yellow-900/50 text-yellow-300 px-1.5 rounded">⭐</span>':''}
            ${item.is_active===false?'<span class="text-xs text-red-400">⊘</span>':''}
          </div>
        </div>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <button onclick="handleEdit('${esc(pkId)}')" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm">✏️</button>
        <button onclick="handleDelete('${esc(pkId)}')" class="px-2.5 py-1 bg-red-900/40 hover:bg-red-800/40 text-red-300 rounded text-sm">🗑️</button>
      </div>
    </div>
  </div>`;
}

    <div class="bg-slate-800 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-hidden" onclick="event.stopPropagation()">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h3 class="text-lg font-bold text-amber-400">${isNew?'➕ New':'✏️ Edit'} ${cfg.name}</h3>
        <button onclick="handleCloseModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
      </div>
      <div class="p-4 overflow-y-auto max-h-[calc(90vh-120px)]">
        <form id="editForm" class="space-y-4">
          ${cfg.fields.map(f=>renderField(f,item)).join('')}

      </div>
      <div class="p-4 border-t border-slate-700 flex justify-end gap-2">
        <button onclick="handleCloseModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg">Cancel</button>
        <button onclick="handleSave()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-lg font-bold">💾 Save</button>
      </div>
    </div>
  </div>`;
}

function renderField(field,item){
  const v=item[field.key];
  switch(field.type){
    case'jsonb':return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
      <div class="space-y-1.5">
        ${LANGS.map(l=>`<div class="flex gap-2 items-center">
          <span class="lang-badge lang-${l}">${l.toUpperCase()}</span>
          <input type="text" data-field="${field.key}" data-lang="${l}" value="${esc(v?.[l]||'')}"
            class="flex-1 px-3 py-1.5 bg-slate-700 border border-slate-600 rounded focus:border-amber-500 focus:outline-none text-sm">
        </div>`).join('')}
      </div>
    </div>`;
    
    case'game_modes_array':return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
      <div class="flex gap-3">
        ${GAME_MODES.map(m=>`<label class="flex items-center gap-1.5 text-sm">
          <input type="checkbox" data-field="${field.key}" data-mode="${m}" ${(v||[]).includes(m)?'checked':''}
            class="w-4 h-4 rounded bg-slate-700 border-slate-600 text-amber-500">
          <span class="mode-badge mode-${m}">${m}</span>
        </label>`).join('')}
      </div>
    </div>`;
    
    case'game_mode_select':return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
      <select data-field="${field.key}" class="w-full px-3 py-1.5 bg-slate-700 border border-slate-600 rounded focus:border-amber-500 focus:outline-none text-sm">
        ${GAME_MODES.map(m=>`<option value="${m}" ${v===m?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>`;
    
    case'choices':
      const choices=v||[];
      return`<div>
        <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
        <div id="choices-container" class="space-y-3">
          ${choices.map((c,i)=>renderChoice(c,i)).join('')}
        </div>
        <button type="button" onclick="addChoice()" class="mt-2 px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm">➕ Add Choice</button>
      </div>`;
    
    case'effects':
      const effs=v||[];
      return`<div>
        <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
        <div id="effects-container" class="space-y-2">
          ${effs.map((e,i)=>renderEffect(e,i)).join('')}
        </div>
        <button type="button" onclick="addEffect()" class="mt-2 px-3 py-1 bg-slate-700 hover:bg-slate-600 rounded text-sm">➕ Add Effect</button>
      </div>`;
    
    case'json':return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
      <textarea data-field="${field.key}" data-type="json" rows="3"
        class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded font-mono text-xs focus:border-amber-500 focus:outline-none">${esc(JSON.stringify(v||{},null,2))}</textarea>
    </div>`;
    
    case'boolean':return`<div class="flex items-center gap-2">
      <input type="checkbox" data-field="${field.key}" ${v?'checked':''} class="w-4 h-4 rounded bg-slate-700 border-slate-600 text-amber-500">
      <label class="text-sm text-gray-300">${field.label}</label>
    </div>`;
    
    case'select':return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
      <select data-field="${field.key}" class="w-full px-3 py-1.5 bg-slate-700 border border-slate-600 rounded focus:border-amber-500 focus:outline-none text-sm">
        <option value="">—</option>
        ${(field.options||[]).map(o=>`<option value="${o}" ${v===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
    
    case'number':return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}</label>
      <input type="number" data-field="${field.key}" value="${v||0}"
        class="w-full px-3 py-1.5 bg-slate-700 border border-slate-600 rounded focus:border-amber-500 focus:outline-none text-sm">
    </div>`;
    
    default:return`<div>
      <label class="block text-sm text-gray-400 mb-1">${field.label}${field.pk?' *':''}</label>
      <input type="text" data-field="${field.key}" value="${esc(v||'')}" ${field.pk?'required':''}
        class="w-full px-3 py-1.5 bg-slate-700 border border-slate-600 rounded focus:border-amber-500 focus:outline-none text-sm">
    </div>`;
  }
}

function renderChoice(choice,index){
  // Collect effect keys from choice
  const effectKeys=Object.keys(choice.effects||{});
  const allEffectKeys=[...new Set([...effectKeys])];
  
  return`<div class="bg-slate-700/50 rounded-lg p-3 border border-slate-600" data-choice-index="${index}">
    <div class="flex justify-between items-center mb-2">
      <span class="text-sm font-bold text-amber-300">Choice ${index+1}</span>
      <button type="button" onclick="removeChoice(${index})" class="text-red-400 hover:text-red-300 text-sm">🗑️</button>
    </div>
    <div class="space-y-2">
      <div class="text-xs text-gray-400">Text:</div>
      ${LANGS.map(l=>`<div class="flex gap-2 items-center">
        <span class="lang-badge lang-${l}">${l.toUpperCase()}</span>
        <input type="text" data-choice="${index}" data-choice-field="text" data-lang="${l}"
          value="${esc(choice.text?.[l]||'')}"
          class="flex-1 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
      </div>`).join('')}
      
      <div class="text-xs text-gray-400 mt-2">Effects (stat: value):</div>
      <div id="choice-effects-${index}" class="space-y-1">
        ${allEffectKeys.map((k,ei)=>`<div class="flex gap-2 items-center" data-choice-effect="${index}">
          <input type="text" data-choice="${index}" data-choice-field="effect_key" data-effect-index="${ei}" value="${esc(k)}" placeholder="stat_id"
            class="w-32 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
          <input type="number" data-choice="${index}" data-choice-field="effect_val" data-effect-index="${ei}" value="${choice.effects?.[k]||0}"
            class="w-20 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
          <button type="button" onclick="removeChoiceEffect(${index},${ei})" class="text-red-400 text-sm">✕</button>
        </div>`).join('')}
      </div>
      <button type="button" onclick="addChoiceEffect(${index})" class="text-xs px-2 py-0.5 bg-slate-600 hover:bg-slate-500 rounded">+ effect</button>
      
      <div class="text-xs text-gray-400 mt-2">Chain Event:</div>
      <div class="flex gap-2">
        <input type="text" data-choice="${index}" data-choice-field="triggers_event" value="${esc(choice.triggers_event||'')}" placeholder="event_id (optional)"
          class="flex-1 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
        <input type="number" data-choice="${index}" data-choice-field="chain_delay" value="${choice.chain_delay||0}" placeholder="delay"
          class="w-16 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none" title="Chain delay (turns)">
      </div>
    </div>
  </div>`;
}

function renderEffect(effect,index){
  return`<div class="bg-slate-700/50 rounded-lg p-2 border border-slate-600 flex gap-2 items-center" data-effect-index="${index}">
    <div class="flex-1">
      <label class="text-xs text-gray-400">Stat ID</label>
      <input type="text" data-effect="${index}" data-effect-field="stat" value="${esc(effect.stat||'')}" placeholder="happiness..."
        class="w-full px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
    </div>
    <div class="w-20">
      <label class="text-xs text-gray-400">Multiplier</label>
      <input type="number" step="0.01" data-effect="${index}" data-effect-field="multiplier" value="${effect.multiplier||0}"
        class="w-full px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
    </div>
    <div class="w-20">
      <label class="text-xs text-gray-400">Baseline</label>
      <input type="number" data-effect="${index}" data-effect-field="baseline" value="${effect.baseline||0}"
        class="w-full px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
    </div>
    <button type="button" onclick="removeEffect(${index})" class="text-red-400 hover:text-red-300 text-sm mt-4">🗑️</button>
  </div>`;
}

// ===== EVENT HANDLERS =====
function attachLoginListener(){
  const f=document.getElementById('loginForm');
  if(f)f.onsubmit=async e=>{
    e.preventDefault();
    try{await signIn(document.getElementById('email').value,document.getElementById('password').value);}
    catch(err){toast('Login error: '+err.message,'error');}
  };
}

window.switchTab=async function(tab){
  S.tab=tab;S.modeFilter='all';
  if(!S.data[tab])await loadData(tab);
  render();
};

window.setModeFilter=function(mode){S.modeFilter=mode;render();};
window.handleRefresh=async function(){await loadData(S.tab);};

window.handleAdd=function(){
  const cfg=TABS[S.tab];
  const item={};
  cfg.fields.forEach(f=>{
    if(f.type==='jsonb')item[f.key]={en:'',ru:''};
    else if(f.type==='choices')item[f.key]=[];
    else if(f.type==='effects')item[f.key]=[];
    else if(f.type==='json')item[f.key]={};
    else if(f.type==='game_modes_array')item[f.key]=['executive'];
    else if(f.type==='game_mode_select')item[f.key]=S.modeFilter!=='all'?S.modeFilter:'executive';
    else if(f.type==='boolean')item[f.key]=true;
    else if(f.type==='number')item[f.key]=0;
    else item[f.key]='';
  });
  S.editing=item;
  render();
};

window.handleEdit=function(pkId){
  const parts=pkId.split('|||');
  const cfg=TABS[S.tab];
  const items=S.data[S.tab]||[];
  const item=items.find(i=>cfg.pkFields.every((pk,idx)=>String(i[pk])===parts[idx]));
  if(item){S.editing={...item,_original:item};render();}
};

window.handleDelete=function(pkId){
  const parts=pkId.split('|||');
  const cfg=TABS[S.tab];
  const items=S.data[S.tab]||[];
  const item=items.find(i=>cfg.pkFields.every((pk,idx)=>String(i[pk])===parts[idx]));
  if(item)deleteItem(S.tab,item);
};

window.handleCloseModal=function(e){
  if(!e||e.target===e.currentTarget){S.editing=null;render();}
};

window.handleSave=async function(){
  const cfg=TABS[S.tab];
  const form=document.getElementById('editForm');
  const item={...S.editing};
  
  // Collect simple fields
  form.querySelectorAll('[data-field]').forEach(input=>{
    const field=input.dataset.field;
    const lang=input.dataset.lang;
    const type=input.dataset.type;
    const mode=input.dataset.mode;
    
    if(mode){
      // game_modes_array checkboxes
      if(!item[field])item[field]=[];
      if(input.checked&&!item[field].includes(mode))item[field].push(mode);
      if(!input.checked)item[field]=item[field].filter(m=>m!==mode);
    }else if(lang){
      if(!item[field])item[field]={};
      item[field][lang]=input.value;
    }else if(type==='json'){
      try{item[field]=JSON.parse(input.value);}
      catch(e){toast('Invalid JSON in '+field,'error');return;}
    }else if(input.type==='checkbox'&&!mode){
      item[field]=input.checked;
    }else if(input.type==='number'){
      item[field]=parseFloat(input.value)||0;
    }else if(input.tagName==='SELECT'){
      item[field]=input.value;
    }else{
      item[field]=input.value;
    }
  });
  
  // Collect choices
  const cc=document.getElementById('choices-container');
  if(cc){
    const choices=[];
    cc.querySelectorAll('[data-choice-index]').forEach(el=>{
      const choice={text:{},effects:{}};
      // Text fields
      el.querySelectorAll('[data-choice-field="text"]').forEach(inp=>{
        choice.text[inp.dataset.lang]=inp.value;
      });
      // Effects (dynamic key-value pairs)
      const keys=el.querySelectorAll('[data-choice-field="effect_key"]');
      const vals=el.querySelectorAll('[data-choice-field="effect_val"]');
      keys.forEach((kInp,i)=>{
        const k=kInp.value.trim();
        if(k)choice.effects[k]=parseInt(vals[i]?.value)||0;
      });
      // Chain fields
      const te=el.querySelector('[data-choice-field="triggers_event"]');
      const cd=el.querySelector('[data-choice-field="chain_delay"]');
      if(te&&te.value.trim())choice.triggers_event=te.value.trim();
      if(cd&&parseInt(cd.value))choice.chain_delay=parseInt(cd.value);
      choices.push(choice);
    });
    item.choices=choices;
  }
  
  // Collect effects (budget)
  const ec=document.getElementById('effects-container');
  if(ec){
    const effects=[];
    ec.querySelectorAll('[data-effect-index]').forEach(el=>{
      const effect={};
      el.querySelectorAll('[data-effect]').forEach(inp=>{
        const f=inp.dataset.effectField;
        if(f==='stat')effect.stat=inp.value;
        else if(f==='multiplier')effect.multiplier=parseFloat(inp.value)||0;
        else if(f==='baseline')effect.baseline=parseFloat(inp.value)||0;
      });
      if(effect.stat)effects.push(effect);
    });
    item.effects=effects;
  }
  
  await saveItem(S.tab,item);
};

// Choice helpers
window.addChoice=function(){
  const cc=document.getElementById('choices-container');
  const i=cc.children.length;
  cc.insertAdjacentHTML('beforeend',renderChoice({text:{en:'',ru:''},effects:{}},i));
};

window.removeChoice=function(i){
  const cc=document.getElementById('choices-container');
  const el=cc.querySelector(`[data-choice-index="${i}"]`);
  if(el)el.remove();
  // Re-index
  cc.querySelectorAll('[data-choice-index]').forEach((el,idx)=>{
    el.dataset.choiceIndex=idx;
    el.querySelector('span').textContent=`Choice ${idx+1}`;
  });
};

window.addChoiceEffect=function(choiceIdx){
  const container=document.getElementById(`choice-effects-${choiceIdx}`);
  if(!container)return;
  const ei=container.children.length;
  container.insertAdjacentHTML('beforeend',`<div class="flex gap-2 items-center" data-choice-effect="${choiceIdx}">
    <input type="text" data-choice="${choiceIdx}" data-choice-field="effect_key" data-effect-index="${ei}" value="" placeholder="stat_id"
      class="w-32 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
    <input type="number" data-choice="${choiceIdx}" data-choice-field="effect_val" data-effect-index="${ei}" value="0"
      class="w-20 px-2 py-1 bg-slate-600 border border-slate-500 rounded text-sm focus:border-amber-500 focus:outline-none">
    <button type="button" onclick="this.parentElement.remove()" class="text-red-400 text-sm">✕</button>
  </div>`);
};

window.removeChoiceEffect=function(choiceIdx,effectIdx){
  const container=document.getElementById(`choice-effects-${choiceIdx}`);
  if(!container)return;
  const el=container.children[effectIdx];
  if(el)el.remove();
};

// Effect helpers (budget)
window.addEffect=function(){
  const ec=document.getElementById('effects-container');
  const i=ec.children.length;
  ec.insertAdjacentHTML('beforeend',renderEffect({stat:'',multiplier:0.3,baseline:15},i));
};

window.removeEffect=function(i){
  const ec=document.getElementById('effects-container');
  const el=ec.querySelector(`[data-effect-index="${i}"]`);
  if(el)el.remove();
};

window.handleSignOut=async function(){
  await supabase.auth.signOut();
  S.user=null;S.profile=null;render();
};

function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

checkAuth();
