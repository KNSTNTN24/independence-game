<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>Independence - School Edition V3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400;600;700&display=swap');
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;font-family:'Raleway',sans-serif;background:#0f172a}
    .font-display{font-family:'Cinzel',serif}
    .gold-gradient{background:linear-gradient(180deg,#60a5fa 0%,#2563eb 50%,#1e40af 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    input[type="range"]{-webkit-appearance:none;height:8px;border-radius:4px;background:#334155}
    input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#60a5fa,#2563eb);cursor:pointer}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .animate-fadeIn{animation:fadeIn .3s ease-out}.animate-slideUp{animation:slideUp .4s ease-out}.animate-pulse{animation:pulse 2s infinite}
    button{min-height:44px;cursor:pointer;transition:all .15s}button:active{transform:scale(.97)}
    .star-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
    .star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:.5}
    .mode-badge{padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:600;display:inline-block}
    .mode-executive{background:#7c3aed20;color:#a78bfa;border:1px solid #7c3aed40}
    .mode-party{background:#2563eb20;color:#60a5fa;border:1px solid #2563eb40}
    .mode-council{background:#05966920;color:#34d399;border:1px solid #05966940}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const{useState,useEffect,useCallback,createContext,useContext,useMemo}=React;

    // ============================================================================
    // CONFIGURATION
    // ============================================================================
    const SUPABASE_URL='https://dnkeinsedcrlhwbiycfo.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRua2VpbnNlZGNybGh3Yml5Y2ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3NDg0MjgsImV4cCI6MjA4NDMyNDQyOH0.9IkWv6dwOemaVwvWrwq7ZzuebrgWI83JWrdaZbzdhhw';
    const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

    const DEFAULT_LANGUAGES=[
      {code:'en',name:'English',flag:'🇬🇧'},
      {code:'ru',name:'Русский',flag:'🇷🇺'},
      {code:'de',name:'Deutsch',flag:'🇩🇪'}
    ];

    // ============================================================================
    // CONTEXTS
    // ============================================================================
    const ContentContext=createContext({});
    const StudentContext=createContext(null);
    const LangContext=createContext({lang:'en',setLang:()=>{},t:()=>''});

    // ============================================================================
    // CONTENT PROVIDER - V3: environments + approaches instead of planets + systems
    // ============================================================================
    function ContentProvider({children}){
      const[content,setContent]=useState({
        languages:DEFAULT_LANGUAGES,texts:{},
        environments:[],approaches:[],events:[],
        gameModes:[],stats:{},budgetCategories:{},factions:[]
      });
      const[loading,setLoading]=useState(true);

      useEffect(()=>{loadAll();},[]);

      const loadAll=async()=>{
        try{
          const[langsR,textsR,envsR,appsR,eventsR,modesR,statsR,budgetR,factionsR]=await Promise.all([
            supabase.from('languages').select('*').eq('is_active',true),
            supabase.from('ui_texts').select('*'),
            supabase.from('environments').select('*').eq('is_active',true).order('sort_order'),
            supabase.from('approaches').select('*').eq('is_active',true).order('sort_order'),
            supabase.from('events').select('*').eq('is_active',true),
            supabase.from('game_modes').select('*').eq('is_active',true).order('sort_order'),
            supabase.from('stats').select('*'),
            supabase.from('budget_categories_v2').select('*').order('sort_order'),
            supabase.from('factions').select('*').eq('is_active',true).order('sort_order')
          ]);

          const texts={};
          textsR.data?.forEach(t=>{
            const parts=t.key.split('.');
            if(parts.length>=2){
              const[cat,...rest]=parts;
              if(!texts[cat])texts[cat]={};
              texts[cat][rest.join('.')]=t.value;
            }
          });

          // Group stats by game_mode
          const stats={};
          statsR.data?.forEach(s=>{
            if(!stats[s.game_mode])stats[s.game_mode]=[];
            stats[s.game_mode].push(s);
          });
          Object.keys(stats).forEach(m=>{stats[m].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));});

          // Group budget by game_mode
          const budgetCategories={};
          budgetR.data?.forEach(b=>{
            if(!budgetCategories[b.game_mode])budgetCategories[b.game_mode]=[];
            budgetCategories[b.game_mode].push(b);
          });

          setContent({
            languages:langsR.data?.length?langsR.data.map(l=>({code:l.code,name:l.native_name||l.name,flag:l.flag})):DEFAULT_LANGUAGES,
            texts,
            environments:envsR.data||[],
            approaches:appsR.data||[],
            events:eventsR.data||[],
            gameModes:modesR.data||[],
            stats,budgetCategories,
            factions:factionsR.data||[]
          });
        }catch(err){console.error('Load error:',err);}
        finally{setLoading(false);}
      };

      return<ContentContext.Provider value={{...content,loading,reload:loadAll}}>{children}</ContentContext.Provider>;
    }

    // ============================================================================
    // LANGUAGE PROVIDER
    // ============================================================================
    function LangProvider({children}){
      const[lang,setLang]=useState(()=>localStorage.getItem('school_lang')||'en');
      const content=useContext(ContentContext);
      
      const t=useCallback((key,fallback='')=>{
        const val=content?.texts?.school?.[key];
        if(val&&typeof val==='object')return val[lang]||val.en||val.ru||fallback||key;
        return fallback||key;
      },[lang,content]);

      const changeLang=l=>{setLang(l);localStorage.setItem('school_lang',l);};
      return<LangContext.Provider value={{lang,setLang:changeLang,t}}>{children}</LangContext.Provider>;
    }

    // ============================================================================
    // STUDENT PROVIDER - V3: reads game_mode/environment/approach from session
    // ============================================================================
    function StudentProvider({children}){
      const[student,setStudent]=useState(null);
      const[classroom,setClassroom]=useState(null);
      const[session,setSession]=useState(null);
      const[scenario,setScenario]=useState(null);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const saved=localStorage.getItem('school_student_v3');
        if(saved){try{const d=JSON.parse(saved);setStudent(d.student);setClassroom(d.classroom);setSession(d.session);setScenario(d.scenario);}catch(e){}}
        setLoading(false);
      },[]);

      const login=async(joinCode,displayName,pin)=>{
        const{data:classrooms}=await supabase.from('classrooms').select('*').eq('join_code',joinCode.toUpperCase()).eq('is_active',true).limit(1);
        if(!classrooms?.length)throw new Error('Class not found');
        const cr=classrooms[0];

        let{data:students}=await supabase.from('students').select('*').eq('classroom_id',cr.id).eq('display_name',displayName).limit(1);
        let st;
        if(students?.length){
          st=students[0];
          if(st.pin_code!==pin)throw new Error('Wrong PIN');
        }else{
          const{data:newSt,error}=await supabase.from('students').insert({classroom_id:cr.id,display_name:displayName,pin_code:pin}).select().single();
          if(error)throw new Error('Could not join');
          st=newSt;
        }

        const{data:sessions}=await supabase.from('classroom_sessions').select('*, scenarios(*)').eq('classroom_id',cr.id).eq('status','active').order('started_at',{ascending:false}).limit(1);
        const sess=sessions?.[0]||null;
        const sc=sess?.scenarios||null;

        setStudent(st);setClassroom(cr);setSession(sess);setScenario(sc);
        localStorage.setItem('school_student_v3',JSON.stringify({student:st,classroom:cr,session:sess,scenario:sc}));
      };

      const logout=()=>{setStudent(null);setClassroom(null);setSession(null);setScenario(null);localStorage.removeItem('school_student_v3');};
      
      const refreshSession=async()=>{
        if(!classroom)return;
        const{data:sessions}=await supabase.from('classroom_sessions').select('*, scenarios(*)').eq('classroom_id',classroom.id).eq('status','active').limit(1);
        const sess=sessions?.[0]||null;
        const sc=sess?.scenarios||null;
        setSession(sess);setScenario(sc);
        localStorage.setItem('school_student_v3',JSON.stringify({student,classroom,session:sess,scenario:sc}));
      };

      return<StudentContext.Provider value={{student,classroom,session,scenario,loading,login,logout,refreshSession}}>{children}</StudentContext.Provider>;
    }

    // ============================================================================
    // UI COMPONENTS
    // ============================================================================
    const StarBackground=()=>{
      const stars=useMemo(()=>Array.from({length:40},(_,i)=>({
        id:i,left:Math.random()*100,top:Math.random()*100,size:Math.random()*2+1,delay:Math.random()*3
      })),[]);
      return<div className="star-bg">{stars.map(s=>
        <div key={s.id} className="star animate-pulse" style={{left:`${s.left}%`,top:`${s.top}%`,width:s.size,height:s.size,animationDelay:`${s.delay}s`}}/>
      )}</div>;
    };

    function LangSelector(){
      const{lang,setLang}=useContext(LangContext);
      const{languages}=useContext(ContentContext);
      return<div className="flex gap-1">
        {languages.map(l=><button key={l.code} onClick={()=>setLang(l.code)} className={`text-lg ${lang===l.code?'opacity-100':'opacity-40 hover:opacity-70'}`} title={l.name}>{l.flag}</button>)}
      </div>;
    }

    function StatBar({stat,value,target,lang}){
      const name=stat.name?.[lang]||stat.name?.en||stat.id;
      const icon=stat.icon||'📊';
      const color=stat.color||'#3B82F6';
      const pct=Math.max(0,Math.min(100,value));
      const meetsTarget=target?pct>=target:true;
      return<div className="mb-2">
        <div className="flex justify-between text-xs mb-1">
          <span>{icon} {name}</span>
          <span className={`font-bold ${meetsTarget?'text-green-400':'text-white'}`}>{Math.round(pct)}%</span>
        </div>
        <div className="h-2 bg-slate-900 rounded overflow-hidden relative">
          <div className="h-full transition-all duration-300" style={{width:`${pct}%`,backgroundColor:color}}/>
          {target&&<div className="absolute top-0 h-full w-0.5 bg-yellow-400" style={{left:`${target}%`}}/>}
        </div>
      </div>;
    }

    // ============================================================================
    // LOGIN SCREEN
    // ============================================================================
    function LoginScreen(){
      const{login}=useContext(StudentContext);
      const{t}=useContext(LangContext);
      const[joinCode,setJoinCode]=useState('');
      const[displayName,setDisplayName]=useState('');
      const[pin,setPin]=useState('');
      const[error,setError]=useState('');
      const[loading,setLoading]=useState(false);

      const handleSubmit=async e=>{
        e.preventDefault();
        if(!joinCode||!displayName||!pin){setError(t('fillAllFields','Please fill all fields'));return;}
        if(pin.length!==4||!/^\d+$/.test(pin)){setError(t('pinMustBe4','PIN must be 4 digits'));return;}
        setLoading(true);setError('');
        try{await login(joinCode.trim(),displayName.trim(),pin);}
        catch(err){setError(err.message);}
        setLoading(false);
      };

      return<div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
        <StarBackground/>
        <div className="max-w-sm w-full relative z-10 animate-fadeIn">
          <div className="flex justify-end mb-2"><LangSelector/></div>
          <div className="text-center mb-8">
            <h1 className="text-4xl font-display font-bold gold-gradient mb-2">INDEPENDENCE</h1>
            <p className="text-blue-300/80 text-sm tracking-widest">SCHOOL EDITION V3</p>
          </div>
          <form onSubmit={handleSubmit} className="bg-slate-800/50 border border-blue-500/30 rounded-2xl p-6 space-y-4">
            <div>
              <label className="text-sm text-gray-400 block mb-1">{t('classCode','Class Code')}</label>
              <input type="text" value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase())} placeholder="MARS-7X2K" maxLength={10} className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white text-center text-xl tracking-widest uppercase focus:border-blue-500 focus:outline-none"/>
            </div>
            <div>
              <label className="text-sm text-gray-400 block mb-1">{t('yourName','Your Name')}</label>
              <input type="text" value={displayName} onChange={e=>setDisplayName(e.target.value)} placeholder="Alex" maxLength={20} className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white focus:border-blue-500 focus:outline-none"/>
            </div>
            <div>
              <label className="text-sm text-gray-400 block mb-1">{t('pin','PIN')} ({t('pinDigits','4 digits')})</label>
              <input type="password" value={pin} onChange={e=>setPin(e.target.value.replace(/\D/g,'').slice(0,4))} placeholder="••••" maxLength={4} className="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-lg text-white text-center text-2xl tracking-widest focus:border-blue-500 focus:outline-none"/>
            </div>
            {error&&<p className="text-red-400 text-sm text-center">{error}</p>}
            <button type="submit" disabled={loading} className="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-xl font-bold text-lg disabled:opacity-50">
              {loading?t('loading','Loading...'):t('join','Join')} 🚀
            </button>
          </form>
          <p className="text-center text-gray-500 text-xs mt-6">{t('askTeacher','Ask your teacher for the class code')}</p>
        </div>
      </div>;
    }

    // ============================================================================
    // MAIN GAME - V3: environments, approaches, event chains, game mode from session
    // ============================================================================
    function Game(){
      const{student,classroom,session,scenario,logout,refreshSession}=useContext(StudentContext);
      const{environments:allEnvs,approaches:allApps,events:allEvents,stats:allStats,budgetCategories:allBudget,gameModes:allModes,texts}=useContext(ContentContext);
      const{lang,t}=useContext(LangContext);

      // V3: Game mode from session (teacher sets it)
      const gameMode=session?.game_mode||scenario?.game_mode||'executive';
      const gmData=allModes.find(m=>m.id===gameMode);
      
      // V3: Filter environments & approaches for this game mode
      const modeEnvs=useMemo(()=>allEnvs.filter(e=>e.game_mode===gameMode),[allEnvs,gameMode]);
      const modeApps=useMemo(()=>allApps.filter(a=>a.game_mode===gameMode),[allApps,gameMode]);
      
      // Stats and budget for mode
      const modeStats=allStats[gameMode]||[];
      const modeBudget=allBudget[gameMode]||[];

      // V3: Events filtered for game mode, with chain support
      const modeEvents=useMemo(()=>
        allEvents.filter(e=>!e.game_modes||e.game_modes.length===0||e.game_modes.includes(gameMode)),
        [allEvents,gameMode]
      );

      // Session constraints (teacher may lock environment/approach)
      const sessionEnvId=session?.environment_id||null;
      const sessionAppId=session?.approach_id||null;
      const maxTurns=session?.max_turns||scenario?.max_turns||12;
      const targetStats=scenario?.target_stats||Object.fromEntries(modeStats.map(s=>[s.id,50]));

      // Game state
      const[phase,setPhase]=useState('lobby');
      const[turn,setTurn]=useState(1);
      const[stats,setStats]=useState({});
      const[budget,setBudget]=useState({});
      const[approachId,setApproachId]=useState(sessionAppId||modeApps[0]?.id||'');
      const[envId,setEnvId]=useState(sessionEnvId||modeEnvs[0]?.id||'');
      const[event,setEvent]=useState(null);
      const[usedEvents,setUsedEvents]=useState([]);
      const[pendingChains,setPendingChains]=useState([]);
      const[finalScore,setFinalScore]=useState(0);
      const[decisionsLog,setDecisionsLog]=useState([]);
      const[classLeaderboard,setClassLeaderboard]=useState([]);

      // Current selections
      const currentEnv=modeEnvs.find(e=>e.id===envId)||modeEnvs[0];
      const currentApp=modeApps.find(a=>a.id===approachId)||modeApps[0];

      // Init stats & budget from DB
      useEffect(()=>{
        if(modeStats.length>0){
          const init={};
          modeStats.forEach(s=>{init[s.id]=s.default_value||50;});
          setStats(init);
        }
        if(modeBudget.length>0){
          const init={};
          modeBudget.forEach(b=>{init[b.id]=b.default_value||15;});
          setBudget(init);
        }
      },[modeStats.length,modeBudget.length]);

      // Set defaults when mode data loads
      useEffect(()=>{
        if(modeEnvs.length>0&&!modeEnvs.find(e=>e.id===envId))setEnvId(sessionEnvId||modeEnvs[0].id);
        if(modeApps.length>0&&!modeApps.find(a=>a.id===approachId))setApproachId(sessionAppId||modeApps[0].id);
      },[modeEnvs,modeApps]);

      // Load leaderboard
      useEffect(()=>{
        if(!session)return;
        supabase.from('student_results').select('student_id,final_score,is_victory,students(display_name)')
          .eq('session_id',session.id).order('final_score',{ascending:false}).limit(10)
          .then(({data})=>{if(data)setClassLeaderboard(data);});
      },[session,phase]);

      useEffect(()=>{if(phase==='lobby')refreshSession();},[phase]);

      // ===== GAME LOGIC =====
      const startGame=()=>{
        const initialStats={};
        modeStats.forEach(s=>{
          let val=s.default_value||50;
          // V3: Apply environment stats_modifiers
          if(currentEnv?.stats_modifiers){
            const mod=currentEnv.stats_modifiers[s.id];
            if(mod!==undefined)val=mod;
          }
          initialStats[s.id]=val;
        });
        setStats(initialStats);
        setTurn(1);
        setUsedEvents([]);
        setPendingChains([]);
        setDecisionsLog([]);
        setPhase('playing');
      };

      const applyBudgetEffects=useCallback(()=>{
        const newStats={...stats};
        modeBudget.forEach(cat=>{
          const val=budget[cat.id]||0;
          (cat.effects||[]).forEach(eff=>{
            const change=(val-(eff.baseline||15))*(eff.multiplier||0);
            if(newStats[eff.stat]!==undefined){
              newStats[eff.stat]=Math.max(0,Math.min(100,newStats[eff.stat]+change));
            }
          });
        });
        return newStats;
      },[stats,budget,modeBudget]);

      // V3: Event selection with chains and priority weighting
      const getEvent=useCallback((currentTurn)=>{
        // 1. Check pending chain events
        const pendingNow=pendingChains.find(p=>p.triggerAtTurn<=currentTurn);
        if(pendingNow){
          const chainEvt=modeEvents.find(e=>e.id===pendingNow.eventId);
          if(chainEvt){
            setPendingChains(prev=>prev.filter(p=>p.eventId!==pendingNow.eventId));
            return chainEvt;
          }
        }
        // 2. Random event (exclude chain reactions)
        let available=modeEvents.filter(e=>
          !usedEvents.includes(e.id)&&
          !e.is_chain_reaction&&
          (e.system==='general'||e.system===approachId||!e.system)
        );
        if(!available.length){
          setUsedEvents([]);
          available=modeEvents.filter(e=>!e.is_chain_reaction);
        }
        if(!available.length)return null;
        // Priority weighting
        const weighted=[];
        available.forEach(e=>{for(let i=0;i<(e.priority||5);i++)weighted.push(e);});
        return weighted[Math.floor(Math.random()*weighted.length)];
      },[modeEvents,usedEvents,pendingChains,approachId]);

      const checkGameEnd=(newStats,newTurn)=>{
        // Defeat: any stat at 0
        for(const s of modeStats){
          if(s.on_min_action==='defeat'&&newStats[s.id]<=0){
            const score=Math.floor(Object.values(newStats).reduce((a,b)=>a+b,0)/modeStats.length);
            endGame(false,'collapse',newStats,score,newTurn);
            return true;
          }
        }
        // End of turns
        if(newTurn>maxTurns){
          const avg=Math.floor(Object.values(newStats).reduce((a,b)=>a+b,0)/modeStats.length);
          const allGood=modeStats.every(s=>newStats[s.id]>=50);
          const score=avg+newTurn*2+(allGood?20:0);
          endGame(allGood||Object.values(newStats).every(v=>v>=30), allGood?'utopia':'struggle', newStats, score, newTurn);
          return true;
        }
        return false;
      };

      const endGame=async(isVictory,vType,finalStats,score,finalTurn)=>{
        setFinalScore(score);
        setPhase(isVictory?'victory':'gameover');
        if(!student||!session)return;
        // V3: Save final_stats as JSON object
        const resultData={
          student_id:student.id,
          session_id:session.id,
          political_system:approachId,
          environment_id:envId,
          approach_id:approachId,
          final_turn:finalTurn||turn,
          final_score:score,
          is_victory:isVictory,
          victory_type:vType,
          final_stats:Object.fromEntries(Object.entries(finalStats).map(([k,v])=>[k,Math.round(v)])),
          decisions_log:decisionsLog,
          completed_at:new Date().toISOString()
        };
        try{await supabase.from('student_results').insert(resultData);}
        catch(e){console.error('Save error:',e);}
      };

      const nextTurn=()=>{
        const newStats=applyBudgetEffects();
        setStats(newStats);
        const nextT=turn+1;
        if(checkGameEnd(newStats,nextT))return;
        const evt=getEvent(nextT);
        if(evt){
          setUsedEvents(prev=>[...prev,evt.id]);
          setEvent(evt);
          setPhase('event');
        }else{
          setTurn(nextT);
        }
      };

      // V3: Handle choice with event chains
      const handleChoice=choice=>{
        setDecisionsLog(prev=>[...prev,{
          turn,eventId:event?.id,
          eventTitle:event?.title?.[lang]||event?.title?.en||'Event',
          eventIcon:event?.icon||'❓',
          choice:choice.text?.[lang]||choice.text?.en,
          effects:choice.effects||{}
        }]);
        
        const newStats={...stats};
        Object.entries(choice.effects||{}).forEach(([k,v])=>{
          if(newStats[k]!==undefined)newStats[k]=Math.max(0,Math.min(100,newStats[k]+v));
        });
        setStats(newStats);
        
        if(checkGameEnd(newStats,turn+1)){setEvent(null);return;}
        
        // V3: Event chains - immediate trigger
        if(choice.triggers_event){
          const chainEvt=modeEvents.find(e=>e.id===choice.triggers_event);
          if(chainEvt){
            setUsedEvents(prev=>[...prev,chainEvt.id]);
            setEvent(chainEvt);
            return; // Stay in event phase
          }
        }
        
        setEvent(null);
        setTurn(t=>t+1);
        setPhase('playing');
      };

      // Story summary
      const generateSummary=useCallback(()=>{
        const appName=currentApp?.name?.[lang]||currentApp?.name?.en||approachId;
        const envName=currentEnv?.name?.[lang]||currentEnv?.name?.en||envId;
        const isVictory=phase==='victory';
        
        let s=`${appName} (${envName}): `;
        if(isVictory){
          s+=`${t('summaryGovSuccess','Successfully governed for')} ${turn} ${t('summaryYears','years')}. `;
        }else{
          let failReason='collapse';
          for(const stat of modeStats){
            if(stats[stat.id]<=0){failReason=stat.name?.[lang]||stat.name?.en||stat.id;break;}
          }
          s+=`${t('summaryGovCollapse','Collapsed after')} ${turn} ${t('summaryYears','years')} — ${failReason}. `;
        }
        if(decisionsLog.length>0){
          s+=`\n\n${t('summaryKeyMoments','Key moments')}:\n`;
          decisionsLog.slice(0,5).forEach(d=>{
            const fx=Object.entries(d.effects||{}).map(([k,v])=>`${k} ${v>=0?'+':''}${v}`).join(', ');
            s+=`• ${t('year','Year')} ${d.turn}: ${d.eventIcon} ${d.eventTitle} — "${d.choice}"${fx?' ('+fx+')':''}\n`;
          });
        }
        return s;
      },[approachId,envId,turn,stats,decisionsLog,phase,currentApp,currentEnv,modeStats,lang,t]);

      // ========== LOBBY ==========
      if(phase==='lobby'){
        const envLocked=!!sessionEnvId;
        const appLocked=!!sessionAppId;
        
        return<div className="min-h-screen bg-slate-950 text-white p-4"><StarBackground/>
          <div className="max-w-md mx-auto pt-4 relative z-10">
            <div className="flex justify-between items-center mb-4">
              <div>
                <p className="text-blue-300 font-bold">{student?.display_name}</p>
                <p className="text-gray-500 text-sm">{classroom?.name}</p>
              </div>
              <div className="flex items-center gap-3">
                <LangSelector/>
                <button onClick={logout} className="text-gray-400 hover:text-white text-sm">{t('logout','Logout')}</button>
              </div>
            </div>

            {/* Game mode badge */}
            <div className="flex items-center gap-2 mb-4">
              <span className={`mode-badge mode-${gameMode}`}>{gmData?.icon||'🎮'} {gmData?.name?.en||gameMode}</span>
              {scenario&&<span className="text-sm text-gray-400">{scenario.title?.[lang]||scenario.title?.en}</span>}
            </div>

            {scenario&&<div className="bg-blue-900/30 border border-blue-500/50 rounded-xl p-4 mb-4">
              <p className="text-sm text-gray-400">{scenario.description?.[lang]||scenario.description?.en}</p>
              <div className="flex gap-4 mt-2 text-xs text-gray-500">
                <span>⏱️ {scenario.duration_minutes||30} min</span>
                <span>🔄 {maxTurns} turns</span>
              </div>
            </div>}

            {!session&&<div className="bg-yellow-900/30 border border-yellow-500/50 rounded-xl p-4 mb-4 text-center">
              <p className="text-yellow-400">⏳ {t('waiting','Waiting for teacher to start session...')}</p>
              <button onClick={refreshSession} className="mt-2 text-sm text-blue-400 underline">{t('refresh','Refresh')}</button>
            </div>}

            <div className="text-center mb-4">
              <h1 className="text-3xl font-display font-bold gold-gradient mb-2">INDEPENDENCE</h1>
              <p className="text-gray-400 text-sm">{t('subtitle','Lead a colony to prosperity through your political decisions')}</p>
            </div>

            {/* How to Play */}
            <details className="bg-slate-800/30 border border-slate-700 rounded-xl p-4 mb-4">
              <summary className="text-blue-300 font-bold cursor-pointer">{t('howToPlayTitle','📖 How to Play')}</summary>
              <div className="mt-3 text-sm text-gray-400 space-y-2">
                <p><strong className="text-white">🎯</strong> {t('howToPlayGoal','Keep your colony stable while maintaining all stats above target levels.')}</p>
                <p><strong className="text-white">🏛️</strong> {t('howToPlaySystem','Each approach has unique traits and challenges.')}</p>
                <p><strong className="text-white">💰</strong> {t('howToPlayBudget','Allocate your budget wisely. Each category affects different stats.')}</p>
                <p><strong className="text-white">⚡</strong> {t('howToPlayEvents','Random events will test your leadership. Your choices have consequences!')}</p>
                <p><strong className="text-white">💀</strong> {t('howToPlayDefeat','If any stat drops to 0%, your government collapses.')}</p>
              </div>
            </details>

            {/* V3: Approach Selection (was Political System) */}
            {modeApps.length>0&&<div className="mb-4">
              <label className="text-sm text-gray-400 block mb-2">🏛️ {t('approach','Approach')}</label>
              {appLocked?
                <div className="p-3 bg-slate-800/50 border border-blue-500/30 rounded-lg flex items-center gap-2">
                  <span className="text-2xl">{currentApp?.icon||'🏛️'}</span>
                  <div>
                    <p className="text-white font-bold">{currentApp?.name?.[lang]||currentApp?.name?.en||approachId}</p>
                    <p className="text-xs text-gray-500">🔒 {t('setByTeacher','Set by teacher')}</p>
                  </div>
                </div>
              :
                <div className="grid grid-cols-2 gap-2">
                  {modeApps.map(a=>
                    <button key={a.id} onClick={()=>setApproachId(a.id)} className={`p-3 rounded-lg border text-left transition ${approachId===a.id?'border-blue-500 bg-blue-500/20':'border-slate-600 hover:border-slate-500'}`}>
                      <span className="text-2xl">{a.icon||'🏛️'}</span>
                      <p className="text-sm text-white mt-1">{a.name?.[lang]||a.name?.en||a.id}</p>
                      {a.is_premium&&<span className="text-yellow-400 text-xs">⭐</span>}
                    </button>
                  )}
                </div>
              }
            </div>}

            {/* V3: Environment Selection (was Planet) */}
            {modeEnvs.length>0&&<div className="mb-4">
              <label className="text-sm text-gray-400 block mb-2">🌍 {t('environment','Environment')}</label>
              {envLocked?
                <div className="p-3 bg-slate-800/50 border border-blue-500/30 rounded-lg flex items-center gap-2">
                  <span className="text-2xl">{currentEnv?.icon||'🌍'}</span>
                  <div>
                    <p className="text-white font-bold">{currentEnv?.name?.[lang]||currentEnv?.name?.en||envId}</p>
                    <p className="text-xs text-gray-500">🔒 {t('setByTeacher','Set by teacher')}</p>
                  </div>
                </div>
              :
                <div className="grid grid-cols-3 gap-2">
                  {modeEnvs.map(e=>
                    <button key={e.id} onClick={()=>setEnvId(e.id)} className={`p-2 rounded-lg border text-center ${envId===e.id?'border-blue-500 bg-blue-500/20':'border-slate-600'}`} title={e.name?.[lang]||e.name?.en||e.id}>
                      <span className="text-2xl">{e.icon||'🌍'}</span>
                      <p className="text-xs text-white mt-1">{e.name?.[lang]||e.name?.en||e.id}</p>
                      <span className="text-xs text-gray-500">{'⭐'.repeat(e.difficulty||1)}</span>
                    </button>
                  )}
                </div>
              }
              {currentEnv&&!envLocked&&<div className="mt-2 p-3 bg-slate-800/50 rounded-lg border border-slate-700">
                <div className="flex justify-between items-center mb-1">
                  <span className="text-white font-bold">{currentEnv.icon} {currentEnv.name?.[lang]||currentEnv.name?.en}</span>
                  <span className="text-xs text-gray-500">{'⭐'.repeat(currentEnv.difficulty||1)}</span>
                </div>
                <p className="text-xs text-gray-400">{currentEnv.description?.[lang]||currentEnv.description?.en}</p>
              </div>}
            </div>}

            <button onClick={startGame} disabled={!session} className="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-xl font-bold text-lg disabled:opacity-50 disabled:cursor-not-allowed">
              🚀 {t('play','Play')}
            </button>

            {classLeaderboard.length>0&&<div className="mt-6 bg-slate-800/50 rounded-xl p-4 border border-blue-500/20">
              <h3 className="text-blue-300 font-bold mb-3">🏆 {t('leaderboard','Class Leaderboard')}</h3>
              <div className="space-y-2">
                {classLeaderboard.slice(0,5).map((r,i)=>
                  <div key={i} className="flex justify-between text-sm">
                    <span className="text-gray-300">{i+1}. {r.students?.display_name}</span>
                    <span className={r.is_victory?'text-green-400':'text-gray-500'}>{r.final_score}</span>
                  </div>
                )}
              </div>
            </div>}
          </div>
        </div>;
      }

      // ========== PLAYING ==========
      if(phase==='playing'){
        const totalBudget=Object.values(budget).reduce((a,b)=>a+(b||0),0);
        
        return<div className="min-h-screen bg-slate-950 text-white p-4"><StarBackground/>
          <div className="max-w-md mx-auto relative z-10">
            <div className="flex justify-between items-center mb-4">
              <div className="flex items-center gap-2">
                <span className="text-2xl">{currentApp?.icon||'🏛️'}</span>
                <span className="text-blue-300 font-bold">{currentApp?.name?.[lang]||currentApp?.name?.en||approachId}</span>
              </div>
              <div className="text-right">
                <span className="text-blue-400 font-display">{t('year','Year')} {turn}/{maxTurns}</span>
                <p className="text-xs text-gray-500">{currentEnv?.icon} {currentEnv?.name?.[lang]||currentEnv?.name?.en||envId}</p>
              </div>
            </div>

            {/* Stats */}
            <div className="bg-slate-800/50 rounded-xl p-4 border border-blue-500/20 mb-4">
              {modeStats.map(stat=>
                <StatBar key={stat.id} stat={stat} value={stats[stat.id]||0} target={targetStats[stat.id]} lang={lang}/>
              )}
            </div>

            {/* Budget */}
            <div className="bg-slate-800/50 rounded-xl p-4 border border-blue-500/20 mb-4">
              <div className="flex justify-between mb-2">
                <span className="text-gray-400">{t('budgetTitle','Budget')} <span className={`font-bold ${totalBudget>100?'text-red-400':'text-white'}`}>({totalBudget}%/100%)</span></span>
              </div>
              <p className="text-xs text-gray-500 mb-3">{t('budgetHint','Allocate your resources wisely.')}</p>
              {modeBudget.map(category=>{
                const others=Object.entries(budget).filter(([k])=>k!==category.id).reduce((sum,[,v])=>sum+(v||0),0);
                const maxForThis=Math.min(category.max_value||50,100-others);
                const name=category.name?.[lang]||category.name?.en||category.id;
                return<div key={category.id} className="mb-2">
                  <div className="flex justify-between text-xs mb-1">
                    <span>{category.icon} {name}</span>
                    <span>{budget[category.id]||0}%</span>
                  </div>
                  <input type="range" min={category.min_value||0} max={maxForThis} value={Math.min(budget[category.id]||0,maxForThis)} onChange={e=>setBudget(prev=>({...prev,[category.id]:parseInt(e.target.value)||0}))} className="w-full"/>
                </div>;
              })}
            </div>

            <button onClick={nextTurn} disabled={totalBudget>100} className="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed">
              {totalBudget>100?t('budgetExceeds','Budget exceeds 100%'):t('next','Next')+' →'}
            </button>
          </div>
        </div>;
      }

      // ========== EVENT ==========
      if(phase==='event'&&event){
        return<div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center"><StarBackground/>
          <div className="max-w-md w-full relative z-10 animate-slideUp">
            <div className="bg-slate-800 rounded-2xl border border-blue-500/30 overflow-hidden">
              <div className="bg-gradient-to-r from-blue-900/50 to-slate-800 p-6 text-center">
                <span className="text-5xl block mb-2">{event.icon}</span>
                <h2 className="text-xl font-display font-bold text-blue-400">{event.title?.[lang]||event.title?.en}</h2>
              </div>
              <div className="p-6">
                <p className="text-gray-300 text-center mb-6">{event.description?.[lang]||event.description?.en}</p>
                <div className="space-y-3">
                  {event.choices?.map((choice,i)=>
                    <button key={i} onClick={()=>handleChoice(choice)} className="w-full p-4 bg-slate-700/50 hover:bg-slate-600/50 border border-slate-600 hover:border-blue-500/50 rounded-xl text-left transition">
                      <div className="font-bold text-blue-200">{choice.text?.[lang]||choice.text?.en}</div>
                      <div className="flex gap-2 mt-2 text-xs flex-wrap">
                        {Object.entries(choice.effects||{}).map(([k,v])=>{
                          const stat=modeStats.find(s=>s.id===k);
                          return<span key={k} className={v>=0?'text-green-400':'text-red-400'}>{stat?.icon||'📊'}{v>=0?'+':''}{v}</span>;
                        })}
                      </div>
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>
        </div>;
      }

      // ========== VICTORY / GAMEOVER ==========
      if(phase==='victory'||phase==='gameover'){
        const isVictory=phase==='victory';
        const summary=generateSummary();
        
        return<div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center"><StarBackground/>
          <div className="max-w-md w-full relative z-10 animate-slideUp">
            <div className={`bg-gradient-to-b ${isVictory?'from-blue-900/50':'from-red-900/50'} to-slate-800 rounded-2xl border ${isVictory?'border-blue-500/50':'border-red-500/50'} p-6`}>
              <div className="text-center">
                <span className="text-5xl block mb-2">{isVictory?'🏆':'💀'}</span>
                <h1 className={`text-2xl font-display font-bold ${isVictory?'gold-gradient':'text-red-400'} mb-2`}>{isVictory?t('victory','Victory!'):t('defeat','Defeat')}</h1>
                <div className="inline-block bg-slate-800/50 rounded-xl px-6 py-3 mb-4">
                  <div className="text-3xl font-bold text-blue-400">{finalScore}</div>
                  <p className="text-gray-400 text-sm">{t('score','Score')}</p>
                </div>
              </div>
              
              {/* Final stats */}
              <div className={`grid grid-cols-${Math.min(modeStats.length,4)} gap-2 mb-4`}>
                {modeStats.map(stat=>
                  <div key={stat.id} className="text-center bg-slate-800/30 rounded-lg p-2">
                    <span className="text-xl">{stat.icon}</span>
                    <p className={`font-bold text-sm ${(stats[stat.id]||0)>=(targetStats[stat.id]||50)?'text-green-400':'text-red-400'}`}>
                      {Math.round(stats[stat.id]||0)}%
                    </p>
                  </div>
                )}
              </div>
              
              <div className="bg-slate-900/50 rounded-xl p-4 mb-4 max-h-48 overflow-y-auto">
                <h3 className="text-blue-300 font-bold text-sm mb-2">📜 {t('yourStory','Your Story')}</h3>
                <p className="text-gray-300 text-sm whitespace-pre-line">{summary}</p>
              </div>
              
              <button onClick={()=>setPhase('lobby')} className={`w-full py-3 bg-gradient-to-r ${isVictory?'from-blue-600 to-blue-500':'from-red-600 to-red-500'} text-white rounded-xl font-bold`}>
                🔄 {t('playAgain','Play Again')}
              </button>
            </div>
          </div>
        </div>;
      }

      return null;
    }

    // ============================================================================
    // APP ROOT
    // ============================================================================
    function App(){
      const{student,loading:studentLoading}=useContext(StudentContext);
      const{loading:contentLoading}=useContext(ContentContext);
      if(studentLoading||contentLoading){
        return<div className="min-h-screen bg-slate-950 flex items-center justify-center">
          <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"/>
        </div>;
      }
      return student?<Game/>:<LoginScreen/>;
    }

    function Root(){
      return<ContentProvider><LangProvider><StudentProvider><App/></StudentProvider></LangProvider></ContentProvider>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
  </script>
</body>
</html>
