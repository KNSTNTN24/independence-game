<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#d97706">
  <meta name="description" content="Independence - образовательная игра о политических системах">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Independence">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
  <title>Independence - Civic Education Game</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400;600;700&display=swap');
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;font-family:'Raleway',sans-serif;background:#0f172a;overscroll-behavior:none}
    .safe-top{padding-top:env(safe-area-inset-top)}.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
    .font-display{font-family:'Cinzel',serif}
    .gold-gradient{background:linear-gradient(180deg,#fbbf24 0%,#d97706 50%,#92400e 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    input[type="range"]{-webkit-appearance:none;height:8px;border-radius:4px}
    input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fbbf24,#d97706);cursor:pointer}
    input[type="text"],input[type="email"],input[type="password"]{-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;pointer-events:auto}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .animate-fadeIn{animation:fadeIn .3s ease-out}.animate-slideUp{animation:slideUp .4s ease-out}
    .animate-pulse{animation:pulse 2s infinite}.animate-spin{animation:spin 1s linear infinite}
    button{min-height:44px;cursor:pointer;transition:all .15s}button:active{transform:scale(.97)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
    .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:200;max-width:90%}
    .star-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
    .star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:.5}
  </style>
</head>
<body class="safe-top safe-bottom">
  <div id="root"></div>
  <script type="text/babel">
    const{useState,useEffect,useCallback,createContext,useContext,useMemo}=React;

    // ===== CONFIG =====
    const SUPABASE_URL='https://dnkeinsedcrlhwbiycfo.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRua2VpbnNlZGNybGh3Yml5Y2ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3NDg0MjgsImV4cCI6MjA4NDMyNDQyOH0.9IkWv6dwOemaVwvWrwq7ZzuebrgWI2JWrdaZbzdhhw';
    const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const CONTENT_CACHE_KEY='independence_content_v3';
    const CONTENT_CACHE_TTL=1000*60*30;

    // ===== V2 DATA LOADER =====
    const loadV2Content=async()=>{
      try{
        const[modes,stats,budget,events,texts,langs]=await Promise.all([
          supabase.from('game_modes').select('*').eq('is_active',true).order('sort_order'),
          supabase.from('stats').select('*').order('sort_order'),
          supabase.from('budget_categories_v2').select('*').order('sort_order'),
          supabase.from('events').select('*').eq('is_active',true).order('sort_order'),
          supabase.from('ui_texts').select('*'),
          supabase.from('languages').select('*').eq('is_active',true).order('sort_order'),
        ]);
        
        if(modes.error||stats.error||budget.error||events.error)throw new Error('DB query failed');
        
        // Group by game_mode
        const STATS_V2={};
        (stats.data||[]).forEach(s=>{
          if(!STATS_V2[s.game_mode])STATS_V2[s.game_mode]=[];
          STATS_V2[s.game_mode].push(s);
        });
        
        const BUDGET_V2={};
        (budget.data||[]).forEach(b=>{
          if(!BUDGET_V2[b.game_mode])BUDGET_V2[b.game_mode]=[];
          BUDGET_V2[b.game_mode].push(b);
        });
        
        // Events - filter by game_modes array
        const EVENTS_V2={};
        (events.data||[]).forEach(e=>{
          const gameModes=e.game_modes||['executive'];
          gameModes.forEach(gm=>{
            if(!EVENTS_V2[gm])EVENTS_V2[gm]=[];
            EVENTS_V2[gm].push({
              id:e.id,
              icon:e.icon,
              title:e.title,
              desc:e.description,
              choices:(e.choices||[]).map(c=>({
                text:c.text,
                effects:c.effects||{},
                cost:c.cost||0,
                triggers_event:c.triggers_event
              })),
              is_chain_trigger:e.is_chain_trigger,
              is_chain_reaction:e.is_chain_reaction,
              priority:e.priority||5,
              conditions:e.conditions
            });
          });
        });
        
        // UI Texts
        const T={ui:{},intro:{},systems:{},planets:{},sectors:{},defeat:{},victoryMsg:{}};
        (texts.data||[]).forEach(t=>{
          const[category,...rest]=t.key.split('.');
          const key=rest.join('.');
          if(T[category]!==undefined){
            if(key)T[category][key]=t.value;
            else Object.assign(T[category],t.value);
          }
        });
        
        const LANGUAGES=(langs.data||[]).map(l=>({code:l.code,flag:l.flag,name:l.native_name||l.name}));
        
        const data={
          GAME_MODES:modes.data||[],
          STATS_V2,
          BUDGET_V2,
          EVENTS_V2,
          T,
          LANGUAGES
        };
        
        localStorage.setItem(CONTENT_CACHE_KEY,JSON.stringify({data,timestamp:Date.now()}));
        console.log('✅ V2 Content loaded:',{modes:modes.data?.length,stats:stats.data?.length,budget:budget.data?.length,events:events.data?.length});
        return data;
      }catch(e){
        console.error('❌ V2 load failed:',e);
        return null;
      }
    };

    const loadCachedContent=()=>{
      try{
        const cached=localStorage.getItem(CONTENT_CACHE_KEY);
        if(cached){
          const{data,timestamp}=JSON.parse(cached);
          if(Date.now()-timestamp<CONTENT_CACHE_TTL){
            console.log('✅ V2 Content from cache');
            return data;
          }
        }
      }catch(e){}
      return null;
    };

    // ===== FALLBACK CONTENT =====
    const FALLBACK_CONTENT={
      GAME_MODES:[
        {id:'executive',icon:'👔',name:{en:'Executive Power',ru:'Исполнительная власть'},description:{en:'Lead a nation as its executive.',ru:'Управляйте страной.'},default_turns:15}
      ],
      STATS_V2:{
        executive:[
          {id:'happiness',icon:'😊',name:{en:'Happiness',ru:'Счастье'},color:'#22C55E',default_value:50,min_value:0,max_value:100,on_min_action:'defeat'},
          {id:'wealth',icon:'💰',name:{en:'Wealth',ru:'Богатство'},color:'#EAB308',default_value:50,min_value:0,max_value:100,on_min_action:'warning'},
          {id:'security',icon:'🛡️',name:{en:'Security',ru:'Безопасность'},color:'#3B82F6',default_value:50,min_value:0,max_value:100,on_min_action:'defeat'},
          {id:'health',icon:'❤️',name:{en:'Health',ru:'Здоровье'},color:'#EF4444',default_value:50,min_value:0,max_value:100,on_min_action:'warning'}
        ]
      },
      BUDGET_V2:{
        executive:[
          {id:'welfare',icon:'🤝',name:{en:'Welfare',ru:'Соцзащита'},default_value:15,min_value:0,max_value:50,effects:[{stat:'happiness',multiplier:0.3,baseline:15}]},
          {id:'economy',icon:'📈',name:{en:'Economy',ru:'Экономика'},default_value:15,min_value:0,max_value:50,effects:[{stat:'wealth',multiplier:0.3,baseline:15}]},
          {id:'defence',icon:'🛡️',name:{en:'Defence',ru:'Оборона'},default_value:15,min_value:0,max_value:50,effects:[{stat:'security',multiplier:0.3,baseline:15}]},
          {id:'healthcare',icon:'🏥',name:{en:'Healthcare',ru:'Здравоохранение'},default_value:15,min_value:0,max_value:50,effects:[{stat:'health',multiplier:0.3,baseline:15}]},
          {id:'education',icon:'📚',name:{en:'Education',ru:'Образование'},default_value:15,min_value:0,max_value:50,effects:[{stat:'happiness',multiplier:0.1,baseline:15},{stat:'wealth',multiplier:0.1,baseline:15}]}
        ]
      },
      EVENTS_V2:{
        executive:[{id:'test',icon:'📰',title:{en:'News',ru:'Новости'},desc:{en:'Something happened.',ru:'Что-то произошло.'},choices:[{text:{en:'OK',ru:'Ок'},effects:{}}]}]
      },
      T:{
        ui:{title:{ru:'INDEPENDENCE',en:'INDEPENDENCE'},subtitle:{ru:'ОБРАЗОВАТЕЛЬНАЯ ИГРА',en:'CIVIC EDUCATION GAME'},startGame:{ru:'Начать игру',en:'Start Game'},year:{ru:'Год',en:'Year'},submit:{ru:'Утвердить бюджет',en:'Submit Budget'},budget:{ru:'Бюджет',en:'Budget'},victory:{ru:'ПОБЕДА!',en:'VICTORY!'},defeat:{ru:'ПОРАЖЕНИЕ',en:'DEFEAT'},playAgain:{ru:'Играть снова',en:'Play Again'},back:{ru:'Назад',en:'Back'},selectMode:{ru:'Выберите режим',en:'Select Mode'},loading:{ru:'Загрузка...',en:'Loading...'}},
        intro:{},systems:{},planets:{},sectors:{},defeat:{},victoryMsg:{}
      },
      LANGUAGES:[{code:'en',flag:'🇬🇧',name:'English'},{code:'ru',flag:'🇷🇺',name:'Русский'}]
    };

    // ===== CONTENT CONTEXT =====
    const ContentContext=createContext(null);
    const useContent=()=>useContext(ContentContext);

    function ContentProvider({children}){
      const[content,setContent]=useState(FALLBACK_CONTENT);
      const[loading,setLoading]=useState(true);

      useEffect(()=>{
        const load=async()=>{
          const cached=loadCachedContent();
          if(cached&&cached.GAME_MODES?.length>0){
            setContent({...FALLBACK_CONTENT,...cached});
          }
          
          const fresh=await loadV2Content();
          if(fresh&&fresh.GAME_MODES?.length>0){
            setContent({...FALLBACK_CONTENT,...fresh});
          }
          setLoading(false);
        };
        load();
      },[]);

      return(<ContentContext.Provider value={{...content,loading}}>{children}</ContentContext.Provider>);
    }

    // ===== LANG CONTEXT =====
    const LangContext=createContext(null);
    const useLang=()=>useContext(LangContext);

    function LangProvider({children}){
      const[lang,setLang]=useState(()=>localStorage.getItem('lang')||'');
      const t=useCallback((key,obj)=>{
        if(obj&&typeof obj==='object')return obj[lang]||obj.en||obj.ru||'';
        return key;
      },[lang]);
      const saveLang=(l)=>{localStorage.setItem('lang',l);setLang(l);};
      return(<LangContext.Provider value={{lang,setLang:saveLang,t}}>{children}</LangContext.Provider>);
    }

    // ===== COMPONENTS =====
    const StarBackground=()=>{
      const stars=useMemo(()=>Array.from({length:50},(_,i)=>({id:i,left:`${Math.random()*100}%`,top:`${Math.random()*100}%`,delay:`${Math.random()*3}s`,size:Math.random()>0.5?'2px':'1px'})),[]);
      return(<div className="star-bg">{stars.map(s=>(<div key={s.id} className="star animate-pulse" style={{left:s.left,top:s.top,animationDelay:s.delay,width:s.size,height:s.size}}/>))}</div>);
    };

    const Spinner=()=><div className="flex justify-center py-8"><div className="w-8 h-8 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"/></div>;

    const Toast=({message,type='info',onClose})=>{
      useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[onClose]);
      const colors={success:'bg-green-600',error:'bg-red-600',warning:'bg-amber-600',info:'bg-blue-600'};
      return(<div className={`toast ${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg animate-slideUp`}>{message}</div>);
    };

    const Modal=({onClose,title,children})=>(
      <div className="modal-overlay animate-fadeIn" onClick={onClose}>
        <div className="bg-slate-800 rounded-xl max-w-md w-full max-h-[90vh] overflow-hidden border border-amber-500/30 mx-4" onClick={e=>e.stopPropagation()}>
          <div className="flex justify-between items-center p-4 border-b border-slate-700">
            <h2 className="text-lg font-bold text-amber-400">{title}</h2>
            <button onClick={onClose} className="text-gray-400 hover:text-white text-2xl">&times;</button>
          </div>
          <div className="p-4 overflow-y-auto max-h-[calc(90vh-80px)]">{children}</div>
        </div>
      </div>
    );

    // ===== STAT BAR =====
    const StatBar=({stat,value,target,lang})=>{
      const pct=Math.min(100,Math.max(0,value));
      const danger=value<20;
      const warning=value<40;
      return(
        <div className="mb-3">
          <div className="flex justify-between text-xs mb-1">
            <span className="text-amber-100/80">{stat.icon} {stat.name?.[lang]||stat.id}</span>
            <span className={`font-bold ${danger?'text-red-400':warning?'text-amber-300':'text-green-400'}`}>
              {Math.round(value)}%
              {target&&<span className="text-gray-500"> / {target}%</span>}
            </span>
          </div>
          <div className="h-2 bg-slate-900 rounded overflow-hidden border border-amber-900/30 relative">
            <div 
              className="h-full transition-all duration-500" 
              style={{width:`${pct}%`,backgroundColor:stat.color||'#22C55E'}}
            />
            {target&&<div className="absolute top-0 bottom-0 w-0.5 bg-white/50" style={{left:`${target}%`}}/>}
          </div>
        </div>
      );
    };

    // ===== BUDGET SLIDER =====
    const BudgetSlider=({category,value,onChange,lang})=>(
      <div className="mb-3">
        <div className="flex justify-between text-sm mb-1">
          <span className="text-amber-100/80">{category.icon} {category.name?.[lang]||category.id}</span>
          <span className="text-amber-300 font-bold">{value}</span>
        </div>
        <input 
          type="range" 
          min={category.min_value||0} 
          max={category.max_value||50} 
          value={value} 
          onChange={e=>onChange(parseInt(e.target.value))}
          className="w-full"
          style={{background:`linear-gradient(90deg,#d97706 ${value*2}%,#1e293b ${value*2}%)`}}
        />
      </div>
    );

    // ===== EVENT CARD =====
    const EventCard=({event,onChoice,lang,stats})=>(
      <div className="bg-slate-800/90 border border-amber-500/30 rounded-xl p-6 animate-slideUp">
        <div className="text-center mb-4">
          <span className="text-4xl">{event.icon}</span>
          <h3 className="text-xl font-bold text-amber-400 mt-2">{event.title?.[lang]||event.title?.en}</h3>
          <p className="text-gray-300 mt-2">{event.desc?.[lang]||event.desc?.en}</p>
          {event.is_chain_trigger&&<span className="inline-block mt-2 text-xs bg-purple-500/30 text-purple-300 px-2 py-1 rounded">🔗 Chain Event</span>}
        </div>
        <div className="space-y-2">
          {event.choices?.map((choice,i)=>(
            <button
              key={i}
              onClick={()=>onChoice(choice,i)}
              className="w-full p-3 bg-slate-700/50 hover:bg-slate-600/50 border border-slate-600 hover:border-amber-500/50 rounded-lg text-left transition"
            >
              <span className="text-amber-100">{choice.text?.[lang]||choice.text?.en}</span>
              <div className="flex gap-2 mt-1 text-xs">
                {Object.entries(choice.effects||{}).map(([stat,val])=>(
                  <span key={stat} className={val>0?'text-green-400':'text-red-400'}>
                    {val>0?'+':''}{val} {stat}
                  </span>
                ))}
                {choice.cost>0&&<span className="text-amber-400">-{choice.cost}💎</span>}
              </div>
            </button>
          ))}
        </div>
      </div>
    );

    // ===== MAIN GAME =====
    function Game(){
      const{GAME_MODES,STATS_V2,BUDGET_V2,EVENTS_V2,T,LANGUAGES,loading:contentLoading}=useContent();
      const{lang,setLang,t}=useLang();

      // Game state
      const[phase,setPhase]=useState('lang'); // lang -> mode_select -> title -> playing -> event -> victory/gameover
      const[gameMode,setGameMode]=useState('executive');
      const[turn,setTurn]=useState(1);
      const[maxTurns,setMaxTurns]=useState(15);
      const[stats,setStats]=useState({});
      const[budget,setBudget]=useState({});
      const[hydrobite,setHydrobite]=useState(100);
      const[event,setEvent]=useState(null);
      const[eventQueue,setEventQueue]=useState([]);
      const[usedEvents,setUsedEvents]=useState([]);
      const[chainModifiers,setChainModifiers]=useState([]);
      const[toast,setToast]=useState(null);
      const[finalScore,setFinalScore]=useState(0);

      // Derived
      const modeStats=STATS_V2[gameMode]||[];
      const modeBudget=BUDGET_V2[gameMode]||[];
      const modeEvents=EVENTS_V2[gameMode]||[];
      const modeConfig=GAME_MODES.find(m=>m.id===gameMode)||{};
      const totalBudget=Object.values(budget).reduce((a,b)=>a+b,0);
      const remaining=hydrobite-totalBudget;

      // Lang select
      useEffect(()=>{if(lang)setPhase('mode_select');},[lang]);

      const showToast=useCallback((msg,type='info')=>setToast({message:msg,type}),[]);

      // Initialize game
      const initGame=useCallback(()=>{
        const initialStats={};
        modeStats.forEach(s=>{initialStats[s.id]=s.default_value||50;});
        setStats(initialStats);

        const initialBudget={};
        modeBudget.forEach(b=>{initialBudget[b.id]=b.default_value||15;});
        setBudget(initialBudget);

        setTurn(1);
        setMaxTurns(modeConfig.default_turns||15);
        setHydrobite(100);
        setUsedEvents([]);
        setEventQueue([]);
        setChainModifiers([]);
        setPhase('playing');
      },[modeStats,modeBudget,modeConfig]);

      // Apply budget effects
      const applyBudgetEffects=useCallback(()=>{
        const newStats={...stats};
        modeBudget.forEach(cat=>{
          const value=budget[cat.id]||0;
          (cat.effects||[]).forEach(eff=>{
            const change=(value-(eff.baseline||15))*(eff.multiplier||0);
            if(newStats[eff.stat]!==undefined){
              newStats[eff.stat]=Math.max(0,Math.min(100,newStats[eff.stat]+change));
            }
          });
        });
        return newStats;
      },[stats,budget,modeBudget]);

      // Get random event
      const getRandomEvent=useCallback(()=>{
        // Filter out chain reactions (they're triggered by choices)
        let available=modeEvents.filter(e=>!e.is_chain_reaction&&!usedEvents.includes(e.id));
        if(available.length===0){
          setUsedEvents([]);
          available=modeEvents.filter(e=>!e.is_chain_reaction);
        }
        if(available.length===0)return null;
        
        // Weight by priority
        const weighted=[];
        available.forEach(e=>{
          const weight=e.priority||5;
          for(let i=0;i<weight;i++)weighted.push(e);
        });
        
        return weighted[Math.floor(Math.random()*weighted.length)];
      },[modeEvents,usedEvents]);

      // Check game end
      const checkGameEnd=useCallback((newStats,newTurn)=>{
        // Check defeat conditions
        for(const s of modeStats){
          if(s.on_min_action==='defeat'&&newStats[s.id]<=0){
            setFinalScore(Math.floor(Object.values(newStats).reduce((a,b)=>a+b,0)/modeStats.length));
            setPhase('gameover');
            return true;
          }
        }
        
        // Check victory - all stats above 70 at end
        if(newTurn>maxTurns){
          const allGood=modeStats.every(s=>newStats[s.id]>=50);
          const avgStat=Math.floor(Object.values(newStats).reduce((a,b)=>a+b,0)/modeStats.length);
          setFinalScore(avgStat+newTurn*2+(allGood?20:0));
          setPhase(allGood?'victory':'gameover');
          return true;
        }
        
        return false;
      },[modeStats,maxTurns]);

      // Process turn
      const processTurn=useCallback(()=>{
        if(remaining<0){
          showToast('❌ Budget exceeded!','error');
          return;
        }

        // Apply budget effects
        const newStats=applyBudgetEffects();
        setStats(newStats);

        // Check game end
        if(checkGameEnd(newStats,turn+1))return;

        // Get random event
        const evt=getRandomEvent();
        if(evt){
          setUsedEvents(prev=>[...prev,evt.id]);
          setEvent(evt);
          setPhase('event');
        }else{
          setTurn(t=>t+1);
        }
      },[remaining,applyBudgetEffects,checkGameEnd,turn,getRandomEvent,showToast]);

      // Handle event choice
      const handleEventChoice=useCallback((choice,index)=>{
        // Apply effects
        const newStats={...stats};
        Object.entries(choice.effects||{}).forEach(([stat,val])=>{
          if(newStats[stat]!==undefined){
            newStats[stat]=Math.max(0,Math.min(100,newStats[stat]+val));
          }
        });
        
        // Apply cost
        if(choice.cost){
          setHydrobite(h=>Math.max(0,h-choice.cost));
        }
        
        setStats(newStats);
        
        // Check for triggered chain event
        if(choice.triggers_event){
          const chainEvent=modeEvents.find(e=>e.id===choice.triggers_event);
          if(chainEvent){
            setEvent(chainEvent);
            return; // Stay in event phase
          }
        }
        
        // Check game end
        if(checkGameEnd(newStats,turn+1)){
          setEvent(null);
          return;
        }
        
        // Continue to next turn
        setEvent(null);
        setTurn(t=>t+1);
        setPhase('playing');
      },[stats,modeEvents,checkGameEnd,turn]);

      // Handle budget change
      const handleBudget=(id,value)=>{
        setBudget(prev=>({...prev,[id]:value}));
      };

      // ===== RENDER =====
      
      // Loading
      if(contentLoading){
        return(<div className="min-h-screen bg-slate-950 flex items-center justify-center"><StarBackground/><Spinner/></div>);
      }

      // Language select
      if(phase==='lang'){
        return(
          <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
            <StarBackground/>
            <div className="text-center relative z-10">
              <h1 className="text-4xl font-display font-bold gold-gradient mb-8">INDEPENDENCE</h1>
              <p className="text-gray-400 mb-6">{T.ui?.selectLanguage?.en||'Select Language'}</p>
              <div className="flex flex-col gap-3">
                {LANGUAGES.map(l=>(
                  <button key={l.code} onClick={()=>setLang(l.code)} className="px-8 py-4 bg-slate-800 hover:bg-slate-700 border border-amber-500/30 rounded-xl text-lg">
                    {l.flag} {l.name}
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      // Mode select (NEW!)
      if(phase==='mode_select'){
        return(
          <div className="min-h-screen bg-slate-950 text-white p-4">
            <StarBackground/>
            <div className="max-w-lg mx-auto pt-8 relative z-10">
              <h1 className="text-3xl font-display font-bold gold-gradient text-center mb-2">INDEPENDENCE</h1>
              <p className="text-center text-gray-400 mb-8">{T.ui?.selectMode?.[lang]||'Select Game Mode'}</p>
              
              <div className="space-y-4">
                {GAME_MODES.map(mode=>(
                  <button
                    key={mode.id}
                    onClick={()=>{setGameMode(mode.id);setPhase('title');}}
                    className="w-full p-4 bg-slate-800/70 hover:bg-slate-700/70 border border-amber-500/30 hover:border-amber-500 rounded-xl text-left transition"
                  >
                    <div className="flex items-center gap-4">
                      <span className="text-4xl">{mode.icon}</span>
                      <div className="flex-1">
                        <h3 className="text-lg font-bold text-amber-400">{mode.name?.[lang]||mode.name?.en||mode.id}</h3>
                        <p className="text-sm text-gray-400 mt-1">{mode.description?.[lang]||mode.description?.en||''}</p>
                      </div>
                      <span className="text-2xl text-amber-500">→</span>
                    </div>
                  </button>
                ))}
              </div>
              
              <button onClick={()=>setPhase('lang')} className="w-full mt-6 py-3 text-gray-500 hover:text-gray-400">
                🌐 {lang==='ru'?'Сменить язык':'Change language'}
              </button>
            </div>
          </div>
        );
      }

      // Title / Settings
      if(phase==='title'){
        return(
          <div className="min-h-screen bg-slate-950 text-white p-4">
            <StarBackground/>
            <div className="max-w-md mx-auto pt-4 relative z-10">
              <div className="flex justify-between items-center mb-6">
                <button onClick={()=>setPhase('mode_select')} className="text-gray-400 hover:text-white">← {T.ui?.back?.[lang]||'Back'}</button>
                <div className="flex items-center gap-2">
                  <span className="text-3xl">{modeConfig.icon}</span>
                  <span className="text-amber-300 font-bold">{modeConfig.name?.[lang]||modeConfig.name?.en}</span>
                </div>
              </div>

              <div className="text-center mb-6">
                <h1 className="text-4xl font-display font-bold gold-gradient">{T.ui?.title?.[lang]||'INDEPENDENCE'}</h1>
                <p className="text-amber-200/60 text-sm">{T.ui?.subtitle?.[lang]||'CIVIC EDUCATION GAME'}</p>
              </div>

              {/* Stats preview */}
              <div className="bg-slate-800/50 rounded-xl p-4 border border-amber-500/20 mb-4">
                <p className="text-xs text-gray-400 mb-2">📊 {lang==='ru'?'Показатели режима':'Mode Stats'}:</p>
                <div className="flex flex-wrap gap-2">
                  {modeStats.map(s=>(
                    <span key={s.id} className="px-2 py-1 bg-slate-700/50 rounded text-sm" style={{color:s.color}}>
                      {s.icon} {s.name?.[lang]||s.id}
                    </span>
                  ))}
                </div>
              </div>

              {/* Game length */}
              <div className="mb-4">
                <label className="text-sm text-gray-400 block mb-1">⏱️ {T.ui?.gameLength?.[lang]||'Game Length'}: {maxTurns} {T.ui?.years?.[lang]||'years'}</label>
                <input 
                  type="range" min="10" max="30" step="5" 
                  value={maxTurns} 
                  onChange={e=>setMaxTurns(parseInt(e.target.value))} 
                  className="w-full"
                  style={{background:`linear-gradient(90deg,#d97706 ${(maxTurns-10)/20*100}%,#1e293b ${(maxTurns-10)/20*100}%)`}}
                />
              </div>

              <button onClick={initGame} className="w-full py-4 bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-500 text-slate-900 rounded-xl font-display font-bold text-lg hover:from-amber-400 hover:to-yellow-400">
                {T.ui?.startGame?.[lang]||'Start Game'}
              </button>
            </div>
          </div>
        );
      }

      // Playing
      if(phase==='playing'){
        return(
          <div className="min-h-screen bg-slate-950 text-white p-4">
            <StarBackground/>
            <div className="max-w-md mx-auto relative z-10">
              {/* Header */}
              <div className="flex justify-between items-center mb-4">
                <div className="flex items-center gap-2">
                  <span className="text-2xl">{modeConfig.icon}</span>
                  <span className="text-amber-300 font-bold">{modeConfig.name?.[lang]||gameMode}</span>
                </div>
                <div className="text-right">
                  <span className="text-amber-400 font-display">{T.ui?.year?.[lang]||'Year'} {turn}/{maxTurns}</span>
                </div>
              </div>

              {/* Stats */}
              <div className="bg-slate-800/50 rounded-xl p-4 border border-amber-500/20 mb-4">
                {modeStats.map(s=>(
                  <StatBar key={s.id} stat={s} value={stats[s.id]||0} target={50} lang={lang}/>
                ))}
                <div className="flex justify-between items-center mt-3 pt-3 border-t border-slate-700">
                  <span className="text-amber-200/80">💎 {T.ui?.budget?.[lang]||'Budget'}</span>
                  <span className={`font-bold ${remaining<0?'text-red-400':'text-amber-300'}`}>
                    {hydrobite} ({remaining>=0?'+':''}{remaining})
                  </span>
                </div>
              </div>

              {/* Budget sliders */}
              <div className="bg-slate-800/50 rounded-xl p-4 border border-amber-500/20 mb-4">
                {modeBudget.map(cat=>(
                  <BudgetSlider 
                    key={cat.id} 
                    category={cat} 
                    value={budget[cat.id]||0} 
                    onChange={v=>handleBudget(cat.id,v)}
                    lang={lang}
                  />
                ))}
              </div>

              {/* Submit button */}
              <button 
                onClick={processTurn} 
                disabled={remaining<0}
                className="w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-xl font-bold disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {T.ui?.submit?.[lang]||'Submit Budget'}
              </button>
            </div>
            {toast&&<Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)}/>}
          </div>
        );
      }

      // Event
      if(phase==='event'&&event){
        return(
          <div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center">
            <StarBackground/>
            <div className="max-w-md w-full relative z-10">
              <EventCard event={event} onChoice={handleEventChoice} lang={lang} stats={stats}/>
            </div>
          </div>
        );
      }

      // Victory
      if(phase==='victory'){
        return(
          <div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center">
            <StarBackground/>
            <div className="text-center relative z-10 animate-fadeIn">
              <div className="text-6xl mb-4">🏆</div>
              <h1 className="text-4xl font-display font-bold gold-gradient mb-4">{T.ui?.victory?.[lang]||'VICTORY!'}</h1>
              <p className="text-2xl text-amber-300 mb-2">{T.ui?.score?.[lang]||'Score'}: {finalScore}</p>
              <p className="text-gray-400 mb-8">{turn} {T.ui?.years?.[lang]||'years'}</p>
              <button onClick={()=>setPhase('mode_select')} className="px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-xl font-bold">
                {T.ui?.playAgain?.[lang]||'Play Again'}
              </button>
            </div>
          </div>
        );
      }

      // Game Over
      if(phase==='gameover'){
        return(
          <div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center">
            <StarBackground/>
            <div className="text-center relative z-10 animate-fadeIn">
              <div className="text-6xl mb-4">💀</div>
              <h1 className="text-4xl font-display font-bold text-red-500 mb-4">{T.ui?.defeat?.[lang]||'DEFEAT'}</h1>
              <p className="text-2xl text-gray-400 mb-2">{T.ui?.score?.[lang]||'Score'}: {finalScore}</p>
              <p className="text-gray-500 mb-8">{turn} {T.ui?.years?.[lang]||'years'}</p>
              <button onClick={()=>setPhase('mode_select')} className="px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-xl font-bold">
                {T.ui?.playAgain?.[lang]||'Play Again'}
              </button>
            </div>
          </div>
        );
      }

      return null;
    }

    // ===== APP =====
    function App(){
      return(
        <ContentProvider>
          <LangProvider>
            <Game/>
          </LangProvider>
        </ContentProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
