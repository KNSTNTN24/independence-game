      try{

        return null;
      }

      try{
        const cached=localStorage.getItem(CONTENT_CACHE_KEY);

          const{data,timestamp}=JSON.parse(cached);
          if(Date.now()-timestamp<CONTENT_CACHE_TTL){
            console.log('✅ Content loaded from cache');
            return data;
          }
        }
      }catch(e){}
      return null;
    };

      if(!data)return null;
      
      try{
        // UI Texts -> T object
        const T={ui:{},intro:{},systems:{},planets:{},sectors:{},defeat:{},victoryMsg:{}};

            choices:(e.choices||[]).map(c=>({text:c.text,effects:c.effects||{},cost:c.cost||0,hydro:c.hydro||0}))

          if(EVENTS[e.system])EVENTS[e.system].push(event);
          else EVENTS.general.push(event);
        });

        const SECTORS=(data.sectors||[]).map(s=>{
          T.sectors[s.id]={name:s.name};
          return{id:s.id,icon:s.icon,name:s.name};

          STATS_V2[s.game_mode].push(s);
        });
        // Sort each mode's stats

        });
        Object.keys(BUDGET_V2).forEach(mode=>{
          BUDGET_V2[mode].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
        });

      useEffect(()=>{
        const load=async()=>{
          // Try cache first for fast load
          try{
            const cached=loadContentFromCache();
            if(cached){
              const transformed=transformContent(cached);
              if(transformed&&Object.keys(transformed.SYSTEMS||{}).length>0){
                console.log('📦 Using cached content');
                setContent(transformed);
              }
            }
          }catch(e){console.warn('Cache error:',e);}
          
          // Load fresh from DB
          try{
            const fresh=await loadContentFromDB();
            if(fresh){
              const transformed=transformContent(fresh);
              if(transformed&&Object.keys(transformed.SYSTEMS||{}).length>0){
                console.log('🌐 Using DB content');
                setContent(transformed);
              }
            }
          }catch(e){console.warn('DB error:',e);}
          
          setLoading(false);
        };
        load();
      },[]);

      // Always have content (either loaded or fallback)
      return(<ContentContext.Provider value={content}>{children}</ContentContext.Provider>);

        try{const{data}=await supabase.from('profiles').select('*').eq('id',userId).single();if(data)setProfile(data);}catch(e){console.warn('Profile load error:',e);}
      },[]);

      useEffect(()=>{
        let mounted=true;
        const timeout=setTimeout(()=>{if(mounted&&!initialized){console.warn('Auth timeout, proceeding without auth');setLoading(false);setInitialized(true);}},3000);
        
        supabase.auth.getSession().then(({data:{session}})=>{
          if(!mounted)return;
          const u=session?.user??null;setUser(u);if(u)loadProfile(u.id);setLoading(false);setInitialized(true);
        }).catch(e=>{
          console.warn('Auth error:',e);
          if(mounted){setLoading(false);setInitialized(true);}
        });
        
        const{data:{subscription}}=supabase.auth.onAuthStateChange(async(event,session)=>{
          if(!mounted)return;
          const u=session?.user??null;setUser(u);if(u)await loadProfile(u.id);else setProfile(null);setLoading(false);
        });
        
        return()=>{mounted=false;clearTimeout(timeout);subscription.unsubscribe();};
      },[loadProfile]);

      const signUp=async(email,password,username)=>{const{data,error}=await supabase.auth.signUp({email,password,options:{data:{username,full_name:username}}});if(error)throw error;return data;};

          return newData;
        });
      };

          const newData={...d,choices:[...d.choices]};

            choice.text={...choice.text,[lang]:value};

            const key=field.split('.')[1];
            choice.effects={...choice.effects,[key]:parseInt(value)||0};
          }else{
            choice[field]=parseInt(value)||0;
          }
          newData.choices[idx]=choice;
          return newData;
        });

      const{T,SYSTEMS,PLANETS,EVENTS,SECTORS,DIFFICULTIES,LANGUAGES,STATS_V2,BUDGET_V2}=content||FALLBACK_CONTENT;

      const gameMode='executive';

      const modeBudget=BUDGET_V2?.[gameMode]||[];

      const[phase,setPhase]=useState('lang');
      const[turn,setTurn]=useState(1);
      const[maxTurns,setMaxTurns]=useState(15);
      const[difficulty,setDifficulty]=useState('normal');
      const[stats,setStats]=useState({});
      const[hydrobite,setHydrobite]=useState(100);
      const[budget,setBudget]=useState({});
      const[system,setSystem]=useState('parliamentary');
      const[planetId,setPlanetId]=useState('terranova');
      const[event,setEvent]=useState(null);
      const[eventQueue,setEventQueue]=useState([]);
      const[usedEvents,setUsedEvents]=useState([]);
      const[finalScore,setFinalScore]=useState(0);
      const[victoryType,setVictoryType]=useState(null);
      const[eventsPerTurn,setEventsPerTurn]=useState(1);
      const[targetStats,setTargetStats]=useState({});
      const[showAdvanced,setShowAdvanced]=useState(false);

      const[showAuth,setShowAuth]=useState(false);
      const[showProfile,setShowProfile]=useState(false);
      const[showLeaderboard,setShowLeaderboard]=useState(false);
      const[showPremium,setShowPremium]=useState(false);
      const[toast,setToast]=useState(null);
      const[introStep,setIntroStep]=useState(0);
      const[editingEvent,setEditingEvent]=useState(null);

      const isAdmin=profile?.is_admin||false;

      // Initialize stats and budget from v2 data
      useEffect(()=>{
        if(modeStats.length>0&&Object.keys(stats).length===0){
          const initial={};
          const targets={};
          modeStats.forEach(s=>{
            initial[s.id]=s.default_value||50;
            targets[s.id]=70; // Default target
          });
          setStats(initial);
          setTargetStats(targets);
        }
        if(modeBudget.length>0&&Object.keys(budget).length===0){
          const initial={};
          modeBudget.forEach(b=>{initial[b.id]=b.default_value||15;});
          setBudget(initial);
        }
      },[modeStats,modeBudget]);

      const sys=SYSTEMS[system];
      const planet=PLANETS[planetId];
      const diff=DIFFICULTIES[difficulty];
      const totalBudget=Object.values(budget).reduce((a,b)=>a+(b||0),0);
      const remaining=hydrobite-totalBudget;
      const isPremium=profile?.is_premium||false;

      useEffect(()=>{
        const params=new URLSearchParams(window.location.search);
        if(params.get('success')==='true'){window.history.replaceState({},'','/');setToast({message:'✅ Payment successful!',type:'success'});setTimeout(()=>window.location.reload(),2000);}
        else if(params.get('canceled')==='true'){window.history.replaceState({},'','/');setToast({message:'Payment canceled',type:'warning'});}
      },[]);

      useEffect(()=>{if(lang)setPhase('title');},[lang]);

      const showToast=useCallback((message,type='info')=>setToast({message,type}),[]);

      const calculateScore=useCallback((s,t,isVictory)=>{
        // Calculate average of all stats
        const statValues=Object.values(s);
        let score=Math.floor(statValues.reduce((a,b)=>a+b,0)/statValues.length);
        score+=t*2;if(isVictory)score+=20;
        if(difficulty==='hard')score+=15;if(difficulty==='easy')score-=10;
        return Math.max(0,score);
      },[difficulty]);

      const endGame=useCallback(async(isVictory,vType=null)=>{
        const score=calculateScore(stats,turn,isVictory);
        setFinalScore(score);setVictoryType(vType);
        setPhase(isVictory?'victory':'gameover'); // Set phase first!
        if(user){
          const planetName=T?.planets?.[planetId]?.name?.[lang]||planetId;
          const gameData={planet:planetName,system,difficulty,maxTurns,turn,stats,hydrobite:hydrobite||0,isVictory,victoryType:vType,score,duration:0};
          try{
            const result=await db.saveGameResult(user.id,gameData);
            if(result.error)console.error('DB save error:',result.error);
            if(refreshProfile)await refreshProfile();
          }catch(e){console.error('Save error:',e);}
        }
      },[user,planetId,system,difficulty,maxTurns,turn,stats,hydrobite,lang,calculateScore,refreshProfile,T]);

      const startGame=useCallback(()=>{
        if(!isPremium&&SYSTEMS[system]?.premium){showToast('🔒 Premium required!','warning');return;}
        const d=DIFFICULTIES[difficulty]||{bonus:0,hydroBonus:0};
        const p=PLANETS[planetId]||{stats:{}};
        const s=SYSTEMS[system]||{traits:{}};
        
        // Initialize stats from v2 data
        const initialStats={};
        modeStats.forEach(stat=>{
          const planetValue=p.stats?.[stat.id];
          const baseValue=planetValue!==undefined?planetValue:stat.default_value||50;
          initialStats[stat.id]=Math.max(10,Math.min(90,baseValue+d.bonus-(stat.id==='happiness'?(s.traits.startPenalty||0):0)+(stat.id==='stability'?(s.traits.stabilityBonus||0):0)));
        });
        setStats(initialStats);
        
        // Initialize budget from v2 data
        const initialBudget={};
        modeBudget.forEach(b=>{initialBudget[b.id]=b.default_value||15;});
        setBudget(initialBudget);
        
        setHydrobite(100+(d.hydroBonus||0));
        setTurn(1);
        setUsedEvents([]);
        setEventQueue([]);
        setPhase('playing');
      },[system,difficulty,planetId,isPremium,showToast,modeStats,modeBudget,SYSTEMS,DIFFICULTIES,PLANETS]);

      const getRandomEvents=useCallback((count)=>{
        const general=[...EVENTS.general];const specific=EVENTS[system]||[];const all=[...general,...specific];
        let available=all.filter(e=>!usedEvents.includes(e.id));if(available.length<count){setUsedEvents([]);available=all;}
        const selected=[];for(let i=0;i<count&&available.length>0;i++){const idx=Math.floor(Math.random()*available.length);selected.push(available[idx]);available.splice(idx,1);}
        return selected;
      },[system,usedEvents]);

      const checkGameEnd=useCallback((newStats,newTurn)=>{
        // Check defeat conditions based on v2 stats
        for(const stat of modeStats){
          if(stat.on_min_action==='defeat'&&newStats[stat.id]<=0){
            endGame(false,stat.id);
            return true;
          }
        }
        // Special system risks (legacy support)
        if(sys?.traits?.rebellionRisk&&newStats.happiness<sys.traits.rebellionRisk&&Math.random()<0.3){
          showToast(t('defeat.rebellion'),'error');
          setTimeout(()=>endGame(false,'rebellion'),1000);
          return true;
        }
        if(sys?.traits?.coupRisk&&(newStats.stability||newStats.security)<sys.traits.coupRisk&&Math.random()<0.3){
          showToast(t('defeat.coup'),'error');
          setTimeout(()=>endGame(false,'coup'),1000);
          return true;
        }
        // Early victory - check if all stats are very high
        const statValues=Object.values(newStats);
        const avgStat=statValues.reduce((a,b)=>a+b,0)/statValues.length;
        if(avgStat>=90){endGame(true,'utopia');return true;}
        if(avgStat>=80){endGame(true,'prosperity');return true;}
        // End of game - check targets
        if(newTurn>maxTurns){
          const failed=[];
          Object.entries(targetStats).forEach(([statId,target])=>{
            if(newStats[statId]<target){
              const stat=modeStats.find(s=>s.id===statId);
              failed.push(`${stat?.icon||'📊'}${Math.round(newStats[statId])}%<${target}%`);
            }
          });
          if(failed.length===0){
            endGame(true,'survival');
          }else{
            showToast(`❌ ${failed.join(', ')}`,'error');
            setTimeout(()=>endGame(false,'targets'),500);
          }
          return true;
        }
        return false;
      },[sys,maxTurns,targetStats,modeStats,endGame,showToast,t]);

      const processTurn=useCallback(()=>{
        if(remaining<0){showToast('❌ Budget exceeded!','error');return;}
        if(sys?.traits?.needsApproval&&stats.happiness<sys.traits.threshold){if(Math.random()>0.4){showToast('🏛️ Parliament rejected!','warning');return;}}
        if(sys?.traits?.referendumChance&&Math.random()<sys.traits.referendumChance){showToast('🗳️ Referendum!','info');}

        const d=DIFFICULTIES[difficulty]||{severity:1};
        
        // Apply v2 budget effects
        const newStats={...stats};
        modeBudget.forEach(category=>{
          const value=budget[category.id]||0;
          (category.effects||[]).forEach(effect=>{
            const baseline=effect.baseline||15;
            const multiplier=effect.multiplier||0;
            let change=(value-baseline)*multiplier;
            if(change<0)change*=d.severity;
            if(newStats[effect.stat]!==undefined){
              newStats[effect.stat]=Math.max(0,Math.min(100,newStats[effect.stat]+change));
            }
          });
        });
        
        // Apply system traits
        if(sys?.traits?.happinessDecay)newStats.happiness=Math.max(0,(newStats.happiness||50)-sys.traits.happinessDecay);
        if(sys?.traits?.wealthBonus)newStats.wealth=Math.min(100,(newStats.wealth||50)+sys.traits.wealthBonus*0.2);
        
        // Apply planet mods
        if(planet?.mods?.happinessDecay)newStats.happiness=Math.max(0,(newStats.happiness||50)-planet.mods.happinessDecay);
        if(planet?.mods?.stabilityDecay)newStats.stability=Math.max(0,(newStats.stability||newStats.security||50)-planet.mods.stabilityDecay);
        
        setStats(newStats);
        const avgWealth=(newStats.wealth||50);
        setHydrobite(Math.floor(80+avgWealth*0.3+(d.hydroBonus||0)*0.5));

        const eventCount=eventsPerTurn+(planet?.mods?.extraEvents||0);
        const events=getRandomEvents(eventCount);
        setUsedEvents(prev=>[...prev,...events.map(e=>e.id)]);
        setEventQueue(events);
        if(events.length>0){setEvent(events[0]);setEventQueue(events.slice(1));setPhase('event');}
        else{
          const newTurn=turn+1;
          if(!checkGameEnd(newStats,newTurn)){setTurn(newTurn);setPhase('playing');}
        }
      },[remaining,sys,stats,difficulty,budget,planet,eventsPerTurn,turn,getRandomEvents,checkGameEnd,showToast,modeBudget,DIFFICULTIES]);

      const handleChoice=useCallback((choice)=>{
        const d=DIFFICULTIES[difficulty];let newStats={...stats};
        Object.entries(choice.effects).forEach(([k,v])=>{if(newStats[k]!==undefined){const effectValue=v<0?v*d.severity:v;newStats[k]=Math.max(0,Math.min(100,newStats[k]+effectValue));}});
        let newHydro=hydrobite-choice.cost+(choice.hydro||0);setHydrobite(Math.max(0,newHydro));setStats(newStats);

        if(eventQueue.length>0){setEvent(eventQueue[0]);setEventQueue(q=>q.slice(1));}
        else{
          const newTurn=turn+1;
          if(!checkGameEnd(newStats,newTurn)){setTurn(newTurn);setEvent(null);setPhase('playing');}
        }
      },[difficulty,stats,hydrobite,turn,eventQueue,checkGameEnd]);

      const handleBudget=useCallback((sector,val)=>{setBudget(prev=>({...prev,[sector]:Math.max(0,Math.min(50,parseInt(val)||0))}));},[]);

      // ===== RENDERS =====
      if(!initialized||authLoading){return(<div className="min-h-screen bg-slate-950 flex items-center justify-center"><Spinner size="lg"/></div>);}

      // LANG SELECT
      if(phase==='lang'){
        return(<div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4"><StarBackground/><div className="text-center relative z-10 animate-fadeIn"><h1 className="text-4xl font-display font-bold gold-gradient mb-8">INDEPENDENCE</h1><p className="text-gray-400 mb-6">Select Language</p><div className="space-y-3">{LANGUAGES.map(l=>(<button key={l.code} onClick={()=>{setLang(l.code);setPhase('intro');}} className="w-full max-w-xs mx-auto flex items-center justify-center gap-3 py-4 bg-slate-800/50 border border-amber-500/30 rounded-xl hover:bg-slate-700/50 text-lg"><span className="text-2xl">{l.flag}</span><span>{l.name}</span></button>))}</div><button onClick={()=>{localStorage.clear();sessionStorage.clear();location.reload();}} className="mt-8 text-gray-600 hover:text-gray-400 text-xs">🔄 Reset</button></div></div>);
      }

      // INTRO
      if(phase==='intro'){
        const steps=[{title:t('intro.title'),text:t('intro.p1')},{text:t('intro.p2')},{text:t('intro.p3')},{text:t('intro.mission'),isLast:true}];
        const step=steps[introStep];
        return(<div className="min-h-screen bg-slate-950 text-white p-6 flex items-center justify-center"><StarBackground/><div className="max-w-lg mx-auto text-center relative z-10 animate-fadeIn"><div className="bg-slate-800/50 border border-amber-500/30 rounded-2xl p-8">{step.title&&<h2 className="text-2xl font-display text-amber-400 mb-6">{step.title}</h2>}<p className="text-lg text-gray-300 leading-relaxed mb-8">{step.text}</p><div className="flex gap-4">{introStep>0&&<button onClick={()=>setIntroStep(s=>s-1)} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg">{t('ui.back')}</button>}<button onClick={()=>{if(step.isLast)setPhase('title');else setIntroStep(s=>s+1);}} className="flex-1 py-3 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-lg font-bold">{step.isLast?t('ui.startGame'):t('ui.next')}</button></div><div className="flex justify-center gap-2 mt-6">{steps.map((_,i)=>(<div key={i} className={`w-2 h-2 rounded-full ${i===introStep?'bg-amber-500':'bg-slate-600'}`}/>))}</div></div><button onClick={()=>setPhase('title')} className="mt-4 text-gray-500 hover:text-gray-400 text-sm">{t('ui.skip')}</button></div></div>);
      }

      // TITLE
      if(phase==='title'){
        return(<div className="min-h-screen bg-slate-950 text-white p-4 relative"><StarBackground/><div className="max-w-md mx-auto pt-4 relative z-10">
          <div className="flex justify-between items-center mb-4"><div className="flex gap-2"><button onClick={()=>setShowLeaderboard(true)} className="p-2 bg-slate-800/50 rounded-lg hover:bg-slate-700">🏆</button>{isAdmin&&<a href="admin.html" className="p-2 bg-slate-800/50 rounded-lg hover:bg-slate-700" title="Admin Panel">⚙️</a>}{!isPremium&&<button onClick={()=>setShowPremium(true)} className="px-3 py-2 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-lg text-sm font-bold">⭐ Premium</button>}</div>{user?<button onClick={()=>setShowProfile(true)} className="flex items-center gap-2 px-3 py-2 bg-slate-800/50 rounded-full hover:bg-slate-700"><div className="w-6 h-6 bg-amber-600 rounded-full flex items-center justify-center text-xs font-bold">{profile?.display_name?.[0]?.toUpperCase()||'👤'}</div><span className="text-sm text-amber-300">{profile?.display_name||'Profile'}</span>{profile?.is_premium&&<span className="text-amber-400">⭐</span>}</button>:<button onClick={()=>setShowAuth(true)} className="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-full text-sm font-bold">{t('ui.login')}</button>}</div>

          <div className="text-center mb-6"><h1 className="text-4xl sm:text-5xl font-display font-bold gold-gradient mb-2">{t('ui.title')}</h1><p className="text-amber-200/60 text-sm tracking-widest">{t('ui.subtitle')}</p><button onClick={()=>{localStorage.removeItem('lang');setLang('');setPhase('lang');}} className="mt-3 text-gray-500 hover:text-gray-400 text-sm">🌐 {lang==='ru'?'Сменить язык':lang==='en'?'Change language':'Sprache ändern'}</button></div>

          <div className="mb-4"><label className="text-sm text-gray-400 block mb-2">🌍 {t('ui.choosePlanet')}</label><div className="grid grid-cols-5 gap-2">{Object.entries(PLANETS).map(([id,p])=>(<button key={id} onClick={()=>setPlanetId(id)} className={`p-2 rounded-lg border text-center transition ${planetId===id?'border-amber-500 bg-amber-500/20':'border-slate-600 hover:border-slate-500'}`}><span className="text-2xl block">{p.icon}</span><span className="text-xs text-gray-400">{'★'.repeat(p.difficulty)}</span></button>))}</div><div className="bg-slate-800/30 rounded-lg p-3 mt-2"><p className="text-amber-300 font-bold text-sm">{T.planets[planetId].name[lang]} <span className="text-gray-500 font-normal">• {T.planets[planetId].traits[lang]}</span></p><p className="text-gray-400 text-xs mt-1">{T.planets[planetId].desc[lang]}</p>{T.planets[planetId].quote&&<p className="text-amber-200/50 text-xs mt-2 italic">{T.planets[planetId].quote[lang]}</p>}</div></div>

          <div className="mb-4"><label className="text-sm text-gray-400 block mb-1">📊 {t('ui.difficulty')}</label><div className="grid grid-cols-3 gap-2">{Object.entries(DIFFICULTIES).map(([key,d])=>(<button key={key} onClick={()=>setDifficulty(key)} className={`py-3 rounded-lg border text-sm transition ${difficulty===key?'border-amber-500 bg-amber-500/20 text-amber-300':'border-slate-600 text-gray-400 hover:border-slate-500'}`}>{d.icon} {t(`ui.${key}`)}</button>))}</div></div>

          <div className="mb-4"><label className="text-sm text-gray-400 block mb-1">⏱️ {t('ui.gameLength')}: {maxTurns} {t('ui.years')}</label><input type="range" min="10" max="30" step="5" value={maxTurns} onChange={e=>setMaxTurns(parseInt(e.target.value))} className="w-full" style={{background:`linear-gradient(90deg,#d97706 ${(maxTurns-10)/20*100}%,#1e293b ${(maxTurns-10)/20*100}%)`}}/></div>

          <div className="mb-4"><label className="text-sm text-gray-400 block mb-1">🏛️ {t('ui.politicalSystem')}</label><div className="grid grid-cols-2 gap-2">{Object.entries(SYSTEMS).map(([id,s])=>(<button key={id} onClick={()=>setSystem(id)} className={`p-3 rounded-lg border text-left transition ${system===id?'border-amber-500 bg-amber-500/10':'border-slate-600 hover:border-slate-500'} ${s.premium&&!isPremium?'opacity-60':''}`}><div className="flex items-center gap-2"><span className="text-xl">{s.icon}</span><span className="text-sm font-bold text-amber-200">{T.systems[id].name[lang]}</span>{s.premium&&!isPremium&&<span className="text-xs bg-amber-500/20 text-amber-400 px-1 rounded">⭐</span>}</div></button>))}</div><div className="bg-slate-800/30 rounded-lg p-3 mt-2"><p className="text-gray-400 text-xs">{T.systems[system].desc[lang]}</p><div className="flex gap-4 mt-2 text-xs"><span className="text-green-400">✓ {T.systems[system].pros[lang]}</span><span className="text-red-400">✗ {T.systems[system].cons[lang]}</span></div></div></div>

          <button onClick={()=>setShowAdvanced(!showAdvanced)} className="w-full text-sm text-gray-400 hover:text-gray-300 mb-4">{showAdvanced?'▲':'▼'} {t('ui.advancedSettings')}</button>

          {showAdvanced&&(<div className="bg-slate-800/50 rounded-lg p-4 mb-4 space-y-4">
            <div><label className="text-sm text-gray-400">{t('ui.eventsPerTurn')}: {eventsPerTurn}</label><input type="range" min="1" max="4" value={eventsPerTurn} onChange={e=>setEventsPerTurn(parseInt(e.target.value))} className="w-full"/></div>
            {/* V2: Dynamic target sliders for each stat */}
            {modeStats.map(stat=>(<div key={stat.id}>
              <label className="text-sm text-gray-400">{t('ui.target')} {stat.icon} {stat.name?.[lang]||stat.id}: {targetStats[stat.id]||70}%</label>
              <input type="range" min="50" max="90" step="5" value={targetStats[stat.id]||70} onChange={e=>setTargetStats(prev=>({...prev,[stat.id]:parseInt(e.target.value)}))} className="w-full"/>
            </div>))}
          </div>)}

          <button onClick={startGame} className="w-full py-4 bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-500 text-slate-900 rounded-xl font-display font-bold text-lg hover:from-amber-400 hover:to-yellow-400">{t('ui.startGame')}</button>
        </div>
        {showAuth&&<AuthModal onClose={()=>setShowAuth(false)}/>}
        {showProfile&&<ProfileModal onClose={()=>setShowProfile(false)}/>}
        {showLeaderboard&&<LeaderboardModal onClose={()=>setShowLeaderboard(false)}/>}
        {showPremium&&<PremiumModal onClose={()=>setShowPremium(false)}/>}
        {toast&&<Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)}/>}
        </div>);
      }

      // PLAYING
      if(phase==='playing'){
        const getStatColor=(value,target)=>value>=(target||70)?'text-green-400':value>=(target||70)-10?'text-amber-300':'text-red-400';
        return(<div className="min-h-screen bg-slate-950 text-white p-4"><StarBackground/><div className="max-w-md mx-auto relative z-10">
          <div className="flex justify-between items-center mb-4"><div className="flex items-center gap-2"><span className="text-2xl">{sys?.icon||'🏛️'}</span><span className="text-amber-300 font-bold">{T.systems?.[system]?.leader?.[lang]||'Leader'}</span></div><div className="text-right"><span className="text-amber-400 font-display">{t('ui.year')} {turn}/{maxTurns}</span><p className="text-xs text-gray-500">{T.planets?.[planetId]?.name?.[lang]||planetId}</p></div></div>

          {/* V2: Dynamic stats from DB */}
          <div className="bg-slate-800/50 rounded-xl p-4 border border-amber-500/20 mb-4">
            {modeStats.map(stat=>{
              const value=stats[stat.id]||0;
              const target=targetStats[stat.id]||70;
              return(<div key={stat.id} className="mb-2">
                <div className="flex justify-between text-xs mb-1">
                  <span className="text-amber-100/80">{stat.icon} {stat.name?.[lang]||stat.name?.en||stat.id}</span>
                  <span className={`font-bold ${getStatColor(value,target)}`}>{Math.round(value)}% <span className="text-gray-500">/ {target}%</span></span>
                </div>
                <div className="h-2 bg-slate-900 rounded overflow-hidden border border-amber-900/30 relative">
                  <div className="h-full transition-all duration-500" style={{width:`${Math.min(100,Math.max(0,value))}%`,background:`linear-gradient(90deg,${stat.color||'#d97706'},${stat.color||'#fbbf24'})`}}/>
                  <div className="absolute top-0 bottom-0 w-0.5 bg-white/50" style={{left:`${target}%`}}/>
                </div>
              </div>);
            })}
            <div className="flex justify-between items-center mt-3 pt-3 border-t border-slate-700"><span className="text-amber-200/80">💎 {t('ui.budget')}</span><span className={`font-bold ${remaining<0?'text-red-400':'text-amber-300'}`}>{hydrobite} ({remaining>=0?'+':''}{remaining})</span></div>
          </div>

          {/* V2: Dynamic budget from DB */}
          <div className="bg-slate-800/50 rounded-xl p-4 border border-amber-500/20 mb-4">
            {modeBudget.map(category=>{
              const value=budget[category.id]||0;
              const name=category.name?.[lang]||category.name?.en||category.id;
              return(<div key={category.id} className="mb-3">
                <div className="flex justify-between text-sm mb-1">
                  <span className="text-amber-100/80">{category.icon} {name}</span>
                  <span className="text-amber-300 font-bold">{value}%</span>
                </div>
                <input type="range" min={category.min_value||0} max={category.max_value||50} value={value} onChange={e=>handleBudget(category.id,e.target.value)} className="w-full" style={{background:`linear-gradient(90deg,#d97706 ${value*2}%,#1e293b ${value*2}%)`}}/>
              </div>);
            })}
          </div>

          <button onClick={processTurn} disabled={remaining<0} className="w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-xl font-bold text-lg disabled:opacity-50">{t('ui.submit')}</button>
        </div>{toast&&<Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)}/>}</div>);
      }

      // EVENT
      if(phase==='event'&&event){
        return(<div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center"><StarBackground/><div className="max-w-md w-full relative z-10 animate-slideUp"><div className="bg-slate-800 rounded-2xl border border-amber-500/30 overflow-hidden">
          <div className="bg-gradient-to-r from-amber-900/50 to-slate-800 p-6 text-center relative">
            {isAdmin&&<button onClick={()=>setEditingEvent(event)} className="absolute top-2 right-2 p-2 bg-slate-700/80 hover:bg-slate-600 rounded-lg text-sm" title="Редактировать">✏️</button>}
            <span className="text-5xl block mb-2">{event.icon}</span>
            <h2 className="text-xl font-display font-bold text-amber-400">{event.title?.[lang]||event.title?.en||'Event'}</h2>
          </div>
          <div className="p-6"><p className="text-gray-300 text-center mb-6">{event.desc?.[lang]||event.desc?.en||''}</p><div className="space-y-3">{(event.choices||[]).map((choice,i)=>(<button key={i} onClick={()=>handleChoice(choice)} className="w-full p-4 bg-slate-700/50 hover:bg-slate-600/50 border border-slate-600 hover:border-amber-500/50 rounded-xl text-left transition"><div className="flex justify-between items-start mb-1"><span className="font-bold text-amber-200">{choice.text?.[lang]||choice.text?.en||'Option'}</span><span className="text-amber-400 text-sm">-{choice.cost||0}💎</span></div><div className="flex gap-2 mt-2 text-xs flex-wrap">{Object.entries(choice.effects||{}).map(([k,v])=>{const stat=modeStats.find(s=>s.id===k);return(<span key={k} className={v>=0?'text-green-400':'text-red-400'}>{stat?.icon||'📊'}{v>=0?'+':''}{v}</span>);})}</div></button>))}</div></div>
        </div></div>
        {editingEvent&&<AdminEventEditor event={editingEvent} onClose={()=>setEditingEvent(null)} onSave={()=>showToast('✅ Сохранено! Перезагрузите для обновления.','success')}/>}
        </div>);
      }

      // VICTORY
      if(phase==='victory'){
        return(<div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center"><StarBackground/><div className="max-w-md w-full text-center relative z-10 animate-slideUp"><div className="bg-gradient-to-b from-amber-900/50 to-slate-800 rounded-2xl border border-amber-500/50 p-8"><span className="text-6xl block mb-4">🏆</span><h1 className="text-3xl font-display font-bold gold-gradient mb-4">{t('ui.victory')}</h1><p className="text-amber-200 mb-6">{T.victoryMsg?.[victoryType||'survival']?.[lang]||'You won!'}</p><div className="bg-slate-800/50 rounded-xl p-4 mb-6"><div className="text-4xl font-bold text-amber-400 mb-2">{finalScore}</div><p className="text-gray-400">{t('ui.score')}</p></div>
          <div className={`grid grid-cols-${Math.min(4,modeStats.length)} gap-3 mb-6`}>{modeStats.map(stat=>(<div key={stat.id} className="text-center"><span className="text-xl">{stat.icon}</span><p className="text-sm font-bold" style={{color:stat.color||'#22C55E'}}>{Math.round(stats[stat.id]||0)}%</p></div>))}</div>
          <button onClick={()=>{setPhase('title');setIntroStep(0);}} className="w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-900 rounded-xl font-bold">{t('ui.playAgain')}</button></div></div></div>);
      }

      // GAMEOVER
      if(phase==='gameover'){
        return(<div className="min-h-screen bg-slate-950 text-white p-4 flex items-center justify-center"><StarBackground/><div className="max-w-md w-full text-center relative z-10 animate-slideUp"><div className="bg-gradient-to-b from-red-900/50 to-slate-800 rounded-2xl border border-red-500/50 p-8"><span className="text-6xl block mb-4">💀</span><h1 className="text-3xl font-display font-bold text-red-400 mb-4">{t('ui.defeat')}</h1><p className="text-red-200 mb-6">{T.defeat?.[victoryType||'stability']?.[lang]||'Game Over'}</p><div className="bg-slate-800/50 rounded-xl p-4 mb-6"><p className="text-gray-400">{t('ui.year')} {turn} / {maxTurns}</p><p className="text-2xl font-bold text-red-400">{finalScore} {t('ui.score')}</p></div><button onClick={()=>{setPhase('title');setIntroStep(0);}} className="w-full py-4 bg-gradient-to-r from-red-600 to-red-500 text-white rounded-xl font-bold">{t('ui.playAgain')}</button></div></div></div>);
      }
      return null;
    }

    function App(){return(<ContentProvider><AuthProvider><LangProvider><Game/></LangProvider></AuthProvider></ContentProvider>);}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <script>
    // Cleanup on load
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(r=>r.unregister()));caches.keys().then(k=>k.forEach(k=>caches.delete(k)));}
    // Reset function for debugging
    window.resetGame=()=>{localStorage.clear();sessionStorage.clear();location.reload();};
    // Auto-reset if stuck (check via URL param)
    if(location.search.includes('reset')){localStorage.clear();sessionStorage.clear();history.replaceState({},'',location.pathname);location.reload();}
  </script>
</body>
</html>
